
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>بوابة المرور | أ/إسماعيل عماد</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@4/dist/fp.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 500px;
        }
        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 30px 24px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .header {
            text-align: center;
            margin-bottom: 28px;
        }
        .header h1 {
            color: #facc15;
            font-size: 26px;
            font-weight: 800;
        }
        .header p {
            color: #cbd5e1;
            font-size: 14px;
            margin-top: 8px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: #e2e8f0;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            border: none;
            background: #0f172a;
            border-radius: 20px;
            color: white;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
            border: 1px solid #334155;
        }
        input:focus {
            border-color: #facc15;
            box-shadow: 0 0 0 2px rgba(250,204,21,0.2);
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #facc15, #eab308);
            border: none;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 800;
            color: #0f172a;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        button:hover {
            transform: scale(0.98);
            box-shadow: 0 5px 20px rgba(250,204,21,0.4);
        }
        .message {
            margin-top: 20px;
            padding: 14px;
            border-radius: 20px;
            text-align: center;
            font-weight: 500;
            display: none;
        }
        .success {
            background: #166534;
            color: #bbf7d0;
            display: block;
        }
        .error {
            background: #991b1b;
            color: #fecaca;
            display: block;
        }
        .loading {
            background: #1e3a8a;
            color: #bfdbfe;
            display: block;
        }
        @media (max-width: 480px) {
            .card {
                padding: 20px;
            }
            .header h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="header">
            <h1>أ / إسماعيل عماد</h1>
            <p>01122104596</p>
            <p>بوابة المرور الآمنة</p>
        </div>
        <div class="input-group">
            <label>👤 اسم الطالب (اختياري)</label>
            <input type="text" id="studentName" placeholder="أدخل اسمك (يمكن تركه فارغاً)">
        </div>
        <div class="input-group">
            <label>🔑 كود المرور</label>
            <input type="text" id="code" placeholder="أدخل الكود">
        </div>
        <button id="verifyBtn">🚪 تجاوز البوابة</button>
        <div id="userMessage" class="message"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDCQX8W5omNTx_5tmtyoGjLUvNUKsAJpcA",
        authDomain: "mrismailemad.firebaseapp.com",
        projectId: "mrismailemad",
        storageBucket: "mrismailemad.firebasestorage.app",
        messagingSenderId: "561984577316",
        appId: "1:561984577316:web:02902a7c7980f5b1731db1",
        measurementId: "G-H8N3YCP5E7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const CODES_COLL = "gate_pass_codes";

    let deviceFingerprint = null;
    let fpPromise = null;

    function showMessage(msg, type) {
        const div = document.getElementById("userMessage");
        div.textContent = msg;
        div.className = `message ${type}`;
        setTimeout(() => {
            if(div.className === `message ${type}`) div.className = "message";
        }, 4000);
    }

    async function getFingerprint() {
        if(!fpPromise) {
            fpPromise = FingerprintJS.load();
        }
        const fp = await fpPromise;
        const result = await fp.get();
        return result.visitorId;
    }

    async function verifyAccess() {
        const name = document.getElementById("studentName").value.trim();
        const code = document.getElementById("code").value.trim().toUpperCase();
        const verifyBtn = document.getElementById("verifyBtn");

        if(!code) {
            showMessage("يرجى إدخال كود المرور", "error");
            return;
        }

        verifyBtn.disabled = true;
        verifyBtn.textContent = "⏳ جاري التحقق...";
        showMessage("جاري التحقق من الجهاز...", "loading");

        try {
            const fingerprint = await getFingerprint();
            console.log("بصمة الجهاز:", fingerprint);

            const codeRef = doc(db, CODES_COLL, code);
            const codeSnap = await getDoc(codeRef);

            if(!codeSnap.exists()) {
                showMessage("❌ الكود غير صحيح", "error");
                verifyBtn.disabled = false;
                verifyBtn.textContent = "🚪 تجاوز البوابة";
                return;
            }

            const codeData = codeSnap.data();
            const allowedLinks = codeData.allowedLinks || [];
            
            if(allowedLinks.length === 0) {
                showMessage("⚠️ هذا الكود لم يتم ربطه بأي رابط بعد، تواصل مع الإدارة", "error");
                verifyBtn.disabled = false;
                verifyBtn.textContent = "🚪 تجاوز البوابة";
                return;
            }

            const usedDevices = codeData.usedDevices || [];
            const existingDevice = usedDevices.find(d => d.deviceId === fingerprint);

            if(existingDevice) {
                // نفس الجهاز → يسمح بالدخول لأي رابط من الروابط
                const firstLink = allowedLinks[0];
                showMessage(`✅ مرحباً ${name || existingDevice.name || "الطالب"}! يتم توجيهك...`, "success");
                setTimeout(() => { window.location.href = firstLink; }, 1500);
            } else {
                // جهاز مختلف
                if(usedDevices.length > 0) {
                    showMessage(`⛔ هذا الكود تم استخدامه من قبل من جهاز آخر. لا يمكن استخدامه من جهازك الحالي.`, "error");
                    verifyBtn.disabled = false;
                    verifyBtn.textContent = "🚪 تجاوز البوابة";
                    return;
                } else {
                    // أول استخدام للكود (أول جهاز)
                    await updateDoc(codeRef, {
                        usedDevices: arrayUnion({ 
                            deviceId: fingerprint, 
                            name: name || "غير مسجل",
                            firstUsedAt: new Date().toISOString()
                        })
                    });
                    const firstLink = allowedLinks[0];
                    showMessage(`🎉 تم تفعيل الكود! مرحباً ${name || "الزائر"}... جار التوجيه`, "success");
                    setTimeout(() => { window.location.href = firstLink; }, 1500);
                }
            }
        } catch(error) {
            console.error(error);
            showMessage("حدث خطأ تقني، حاول مرة أخرى", "error");
        } finally {
            verifyBtn.disabled = false;
            verifyBtn.textContent = "🚪 تجاوز البوابة";
        }
    }

    document.getElementById("verifyBtn").addEventListener("click", verifyAccess);
    
    // تحضير البصمة مسبقاً
    getFingerprint().then(fp => {
        deviceFingerprint = fp;
        console.log("تم تحضير بصمة الجهاز:", fp);
    });
</script>
</body>
</html>
