<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>البث المباشر | أ. إسماعيل عماد</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* ===== متغيرات التصميم ===== */
        :root {
            --royal-gold: #D4AF37;
            --academic-purple: #4A2F6B;
            --student-cyan: #00B4D8;
            --deep-navy: #0B1E33;
            --dark-bg: #0A0F1A;
            --card-bg: rgba(11, 30, 51, 0.85);
            --glass-border: rgba(212, 175, 55, 0.25);
            --live-red: #FF3B3B;
            --live-red-glow: rgba(255, 59, 59, 0.3);
            --text-light: #E0E5F0;
            --text-dim: #8A93B0;
            --success: #10b981;
            --warning: #f59e0b;
            --shadow: 0 8px 20px -6px rgba(0, 0, 0, 0.5);
            --today-badge: #10b981;
            --tomorrow-badge: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: radial-gradient(circle at 10% 20%, rgba(212, 175, 55, 0.05) 0%, transparent 35%),
                        radial-gradient(circle at 90% 70%, rgba(0, 180, 216, 0.05) 0%, transparent 35%),
                        linear-gradient(145deg, var(--deep-navy) 0%, #0F1A2F 100%);
            min-height: 100vh;
            color: var(--text-light);
            padding: 12px;
            padding-bottom: 70px;
            position: relative;
        }

        /* ===== الهيدر النحيف ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 60px;
            padding: 8px 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(145deg, var(--academic-purple), #2D1B40);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid var(--royal-gold);
            font-size: 16px;
            color: var(--royal-gold);
        }

        .brand-text {
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: clamp(14px, 4vw, 18px);
            background: linear-gradient(135deg, #fff, var(--royal-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .refresh-btn {
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid var(--glass-border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--royal-gold);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .refresh-btn:active {
            transform: rotate(180deg) scale(0.9);
            background: var(--royal-gold);
            color: var(--deep-navy);
        }

        /* ===== أزرار المراحل ===== */
        .grades-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 8px 0 16px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .grades-chips::-webkit-scrollbar {
            display: none;
        }

        .chip {
            padding: 10px 20px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1.5px solid var(--glass-border);
            border-radius: 60px;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            font-size: clamp(13px, 3.5vw, 14px);
            color: var(--text-dim);
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .chip.active {
            background: var(--royal-gold);
            border-color: var(--royal-gold);
            color: var(--deep-navy);
        }

        .chip:active {
            transform: scale(0.95);
        }

        /* ===== Loader ===== */
        .loader-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
        }

        .loader {
            width: 40px;
            height: 40px;
            border: 4px solid var(--glass-border);
            border-top-color: var(--royal-gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== قائمة البث ===== */
        .live-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 8px;
        }

        /* ===== البطاقة الموحدة ===== */
        .live-card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1.5px solid var(--glass-border);
            border-radius: 32px;
            padding: 16px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .live-card.live {
            border-color: var(--live-red);
            box-shadow: 0 0 20px var(--live-red-glow);
            animation: livePulse 2s infinite;
        }

        @keyframes livePulse {
            0%, 100% { box-shadow: 0 0 20px var(--live-red-glow); }
            50% { box-shadow: 0 0 30px var(--live-red); }
        }

        .live-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: var(--live-red);
            color: white;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--royal-gold);
        }

        .live-badge i {
            animation: radioWave 1.2s infinite;
        }

        @keyframes radioWave {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1); }
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            padding-left: 60px;
        }

        .card-title {
            font-family: 'Cairo', sans-serif;
            font-weight: 800;
            font-size: clamp(16px, 5vw, 18px);
            color: white;
            line-height: 1.3;
        }

        .grade-tag {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--royal-gold);
            border-radius: 30px;
            padding: 4px 12px;
            font-size: 11px;
            font-weight: 600;
            color: var(--royal-gold);
        }

        /* ===== عرض الموعد المتقدم ===== */
        .datetime-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 40px;
            padding: 12px 16px;
            margin: 12px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px dashed var(--glass-border);
        }

        .datetime-text {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: clamp(14px, 4vw, 16px);
            color: var(--text-light);
        }

        .datetime-text i {
            color: var(--royal-gold);
            font-size: 14px;
        }

        .date-badge {
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            background: var(--today-badge);
            color: white;
        }

        .date-badge.tomorrow {
            background: var(--tomorrow-badge);
        }

        /* ===== زر الانضمام ===== */
        .join-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 50px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
            text-decoration: none;
        }

        .join-btn.live {
            background: linear-gradient(145deg, var(--live-red), #C62828);
            color: white;
            border: 1px solid var(--royal-gold);
        }

        .join-btn.live:active {
            transform: scale(0.98);
            filter: brightness(1.2);
        }

        .join-btn.upcoming {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-dim);
            border: 1.5px solid var(--glass-border);
            cursor: default;
            opacity: 0.7;
        }

        .join-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* ===== حالة عدم وجود بث ===== */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 60px;
            border: 1px solid var(--glass-border);
            margin-top: 20px;
        }

        .empty-state i {
            font-size: 48px;
            color: var(--royal-gold);
            opacity: 0.3;
            margin-bottom: 12px;
        }

        .empty-state h3 {
            font-family: 'Cairo', sans-serif;
            font-size: 18px;
            color: white;
            margin-bottom: 6px;
        }

        .empty-state p {
            font-size: 14px;
            color: var(--text-dim);
        }

        /* ===== Toast Notification ===== */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 2px solid var(--royal-gold);
            border-radius: 60px;
            padding: 14px 20px;
            color: white;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateY(150%);
            transition: transform 0.3s ease;
            z-index: 1000;
            box-shadow: var(--shadow);
        }

        .toast.show {
            transform: translateY(0);
        }

        .toast i {
            color: var(--royal-gold);
            font-size: 18px;
        }

        /* ===== توقيع الصفحة ===== */
        .footer {
            text-align: center;
            margin-top: 30px;
            padding: 15px;
            color: var(--text-dim);
            font-size: 12px;
            border-top: 1px solid var(--glass-border);
        }

        .footer span {
            color: var(--royal-gold);
            font-weight: 600;
        }
    </style>
</head>
<body>
    <!-- ===== الهيدر ===== -->
    <div class="header">
        <div class="brand">
            <div class="brand-icon">
                <i class="fas fa-satellite-dish"></i>
            </div>
            <div class="brand-text">بث مباشر</div>
        </div>
        <div class="refresh-btn" onclick="refreshData()">
            <i class="fas fa-sync-alt"></i>
        </div>
    </div>

    <!-- ===== أزرار المراحل ===== -->
    <div class="grades-chips" id="gradeChips">
        <div class="chip active" data-grade="all">📺 الكل</div>
        <div class="chip" data-grade="الصف الرابع الابتدائي">🔵 الرابع الابتدائي</div>
        <div class="chip" data-grade="الصف الأول الإعدادي">🟢 الأول الإعدادي</div>
        <div class="chip" data-grade="الصف الثالث الإعدادي">🟣 الثالث الإعدادي</div>
    </div>

    <!-- ===== قائمة البث ===== -->
    <div id="liveList" class="live-list">
        <div class="loader-container">
            <div class="loader"></div>
        </div>
    </div>

    <!-- ===== توقيع الصفحة ===== -->
    <div class="footer">
        <i class="fas fa-crown" style="color: var(--royal-gold);"></i>
        <span> إسماعيل عماد</span> | البث المباشر 
    </div>

    <!-- ===== Toast Notification ===== -->
    <div id="toast" class="toast">
        <i class="fas fa-info-circle"></i>
        <span id="toastMessage"></span>
    </div>

    <!-- Firebase SDK v10 -->
    <script type="module">
        // ===== تهيئة Firebase =====
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            getDocs, 
            query, 
            where
        } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBPgtF_GqT95QkMwwoJMGiZWFPjHFdA_N0",
            authDomain: "manassa-oloom.firebaseapp.com",
            databaseURL: "https://manassa-oloom-default-rtdb.firebaseio.com",
            projectId: "manassa-oloom",
            storageBucket: "manassa-oloom.firebasestorage.app",
            messagingSenderId: "475047988456",
            appId: "1:475047988456:web:ab25a9b01b5c77483b0d5d",
            measurementId: "G-F0N011WQB9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ===== متغيرات عامة =====
        let allSessions = [];
        let currentFilter = 'all';

        // ===== عناصر DOM =====
        const liveList = document.getElementById('liveList');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        const gradeChips = document.getElementById('gradeChips');

        // ===== دوال مساعدة =====

        /** عرض Toast */
        function showToast(message, isError = false) {
            toastMessage.textContent = message;
            toast.style.borderColor = isError ? '#ef4444' : 'var(--royal-gold)';
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        /** التحقق من الاتصال بالإنترنت */
        function checkInternet() {
            if (!navigator.onLine) {
                showToast('❌ لا يوجد اتصال بالإنترنت', true);
                return false;
            }
            return true;
        }

        /** تحديث البيانات يدوياً */
        window.refreshData = function() {
            if (checkInternet()) {
                loadLiveSessions();
                showToast('🔄 جاري تحديث البيانات...');
            }
        };

        /** إعداد فلترة المراحل */
        function setupGradeFilters() {
            gradeChips.querySelectorAll('.chip').forEach(chip => {
                chip.addEventListener('click', (e) => {
                    const grade = chip.dataset.grade;
                    
                    // تحديث الحالة النشطة
                    gradeChips.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                    chip.classList.add('active');
                    
                    // تطبيق الفلتر
                    currentFilter = grade;
                    displaySessions();
                });
            });
        }

        /** معالجة التوقيت الآمنة */
        function parseSessionTime(scheduledTime) {
            if (!scheduledTime) return null;
            
            if (scheduledTime?.toDate) {
                return scheduledTime.toDate();
            }
            if (typeof scheduledTime === 'string') {
                return new Date(scheduledTime);
            }
            if (scheduledTime instanceof Date) {
                return scheduledTime;
            }
            return null;
        }

        /** تنسيق التاريخ المتقدم باستخدام Intl */
        function formatAdvancedDate(date) {
            if (!date) return null;
            
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);
            
            const sessionDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());
            
            // تحديد نوع اليوم
            let dayType = null;
            if (sessionDate.getTime() === today.getTime()) {
                dayType = 'today';
            } else if (sessionDate.getTime() === tomorrow.getTime()) {
                dayType = 'tomorrow';
            }
            
            // تنسيق التاريخ والوقت بالعربية
            const formatter = new Intl.DateTimeFormat('ar-EG', {
                weekday: 'long',
                hour: '2-digit',
                minute: '2-digit',
                hour12: true
            });
            
            const formattedDate = formatter.format(date);
            
            return {
                full: formattedDate,
                dayType: dayType
            };
        }

        /** فتح رابط Google Meet بشكل آمن */
        function openMeetLink(url) {
            if (!checkInternet()) return false;
            
            if (!url || url === '#') {
                showToast('❌ رابط الحصة غير متاح', true);
                return false;
            }
            
            window.open(url, '_blank', 'noopener,noreferrer');
            return false;
        }

        /** تحميل الجلسات من Firebase */
        async function loadLiveSessions() {
            if (!checkInternet()) return;

            liveList.innerHTML = `
                <div class="loader-container">
                    <div class="loader"></div>
                </div>
            `;

            try {
                const q = query(collection(db, "live_sessions"));
                const snapshot = await getDocs(q);
                
                allSessions = [];
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const scheduledTime = parseSessionTime(data.scheduledTime);
                    
                    // تجاهل الجلسات المنتهية (أكثر من ساعة مضت)
                    if (scheduledTime) {
                        const oneHourAgo = new Date();
                        oneHourAgo.setHours(oneHourAgo.getHours() - 1);
                        
                        if (!data.isActive && scheduledTime < oneHourAgo) {
                            return; // تجاهل الجلسات المنتهية
                        }
                    }
                    
                    allSessions.push({
                        id: doc.id,
                        ...data,
                        scheduledTime: scheduledTime
                    });
                });

                // ترتيب الجلسات: المباشر أولاً، ثم الأحدث تاريخياً
                allSessions.sort((a, b) => {
                    // المباشر دائماً في الأعلى
                    if (a.isActive && !b.isActive) return -1;
                    if (!a.isActive && b.isActive) return 1;
                    
                    // ثم حسب التاريخ (الأحدث أولاً)
                    const timeA = a.scheduledTime?.getTime() || 0;
                    const timeB = b.scheduledTime?.getTime() || 0;
                    return timeB - timeA;
                });

                displaySessions();
                showToast('✅ تم تحميل البيانات');

            } catch (error) {
                console.error("خطأ في تحميل الجلسات:", error);
                liveList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h3>حدث خطأ!</h3>
                        <p>يرجى المحاولة مرة أخرى</p>
                    </div>
                `;
                showToast('❌ فشل تحميل البيانات', true);
            }
        }

        /** عرض الجلسات */
        function displaySessions() {
            let filtered = allSessions;
            
            if (currentFilter !== 'all') {
                filtered = allSessions.filter(s => s.grade === currentFilter);
            }

            if (filtered.length === 0) {
                liveList.innerHTML = `
                    <div class="empty-state">
                        <i class="far fa-calendar-times"></i>
                        <h3>لا توجد حصص مباشرة</h3>
                        <p>لا توجد حصص مجدولة حالياً لهذه المرحلة</p>
                    </div>
                `;
                return;
            }

            let html = '';

            filtered.forEach(session => {
                const isLive = session.isActive === true;
                const scheduledTime = session.scheduledTime;
                
                let cardClass = 'live-card';
                let badgeHtml = '';
                let buttonHtml = '';
                let datetimeHtml = '';

                if (isLive) {
                    // حالة مباشر
                    cardClass += ' live';
                    badgeHtml = `
                        <div class="live-badge">
                            <i class="fas fa-broadcast-tower"></i>
                            مباشر الآن 🔴
                        </div>
                    `;
                    
                    // عرض الوقت أيضاً حتى في حالة المباشر
                    if (scheduledTime) {
                        const formatted = formatAdvancedDate(scheduledTime);
                        if (formatted) {
                            datetimeHtml = `
                                <div class="datetime-container">
                                    <div class="datetime-text">
                                        <i class="far fa-calendar-alt"></i>
                                        <span>${formatted.full}</span>
                                    </div>
                                </div>
                            `;
                        }
                    }
                    
                    buttonHtml = `
                        <a href="#" onclick="return openMeetLink('${session.meetLink || '#'}')" class="join-btn live">
                            <i class="fas fa-video"></i>
                            انضم الآن 🔴
                        </a>
                    `;
                } else if (scheduledTime) {
                    // حالة مجدول
                    const formatted = formatAdvancedDate(scheduledTime);
                    
                    if (formatted) {
                        let badgeClass = '';
                        let badgeText = '';
                        
                        if (formatted.dayType === 'today') {
                            badgeClass = 'date-badge';
                            badgeText = 'اليوم';
                        } else if (formatted.dayType === 'tomorrow') {
                            badgeClass = 'date-badge tomorrow';
                            badgeText = 'غداً';
                        }
                        
                        const badgeHtml_d = badgeText ? `<span class="${badgeClass}">${badgeText}</span>` : '';
                        
                        datetimeHtml = `
                            <div class="datetime-container">
                                <div class="datetime-text">
                                    <i class="far fa-calendar-alt"></i>
                                    <span>${formatted.full}</span>
                                </div>
                                ${badgeHtml_d}
                            </div>
                        `;
                    }
                    
                    buttonHtml = `
                        <button class="join-btn upcoming" disabled>
                            <i class="far fa-clock"></i>
                            لم يحن الموعد بعد
                        </button>
                    `;
                }

                html += `
                    <div id="card-${session.id}" class="${cardClass}">
                        ${badgeHtml}
                        <div class="card-header">
                            <div class="card-title">${session.title || 'بث مباشر'}</div>
                            <div class="grade-tag">${session.grade || 'غير محدد'}</div>
                        </div>
                        ${datetimeHtml}
                        ${buttonHtml}
                    </div>
                `;
            });

            liveList.innerHTML = html;
        }

        // ===== جعل دالة فتح الرابط عامة =====
        window.openMeetLink = openMeetLink;

        // ===== التهيئة =====
        window.addEventListener('load', () => {
            setupGradeFilters();
            loadLiveSessions();
            
            window.addEventListener('online', () => {
                showToast('🌐 تم استعادة الاتصال');
                loadLiveSessions();
            });
            
            window.addEventListener('offline', () => {
                showToast('❌ انقطع الاتصال بالإنترنت', true);
            });
        });

        /* =====================================================
           ⚡ الأكواد الإدارية المخفية (Admin Bridge)
           =====================================================
        ===================================================== */

        window.admin = {
            async createLiveSession(sessionData) {
                try {
                    const { addDoc, collection, serverTimestamp } = await import("https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js");
                    const docRef = await addDoc(collection(db, "live_sessions"), {
                        title: sessionData.title,
                        grade: sessionData.grade,
                        meetLink: sessionData.meetLink,
                        scheduledTime: sessionData.scheduledTime,
                        isActive: sessionData.isActive || false,
                        createdAt: serverTimestamp()
                    });
                    
                    console.log("✅ تم إنشاء الجلسة:", docRef.id);
                    return { success: true, id: docRef.id };
                } catch (error) {
                    console.error("❌ خطأ في إنشاء الجلسة:", error);
                    return { success: false, error };
                }
            },

            async toggleLiveStatus(sessionId, active) {
                try {
                    const { updateDoc, doc } = await import("https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js");
                    const sessionRef = doc(db, "live_sessions", sessionId);
                    await updateDoc(sessionRef, { isActive: active });
                    
                    console.log(`✅ تم ${active ? 'تشغيل' : 'إيقاف'} البث`);
                    return { success: true };
                } catch (error) {
                    console.error("❌ خطأ في تحديث الحالة:", error);
                    return { success: false, error };
                }
            }
        };
    </script>
</body>
</html>
