<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>تسجيل البيانات |  إسماعيل عماد</title>
    <!-- Font Awesome 6.4.0 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Tajawal, Cairo, Changa, Amiri -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&family=Changa:wght@800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* متغيرات CSS - لوحة الألوان النيو-كلاسيك الرقمية */
        :root {
            --royal-gold: #D4AF37;
            --academic-purple: #4A2F6B;
            --student-cyan: #00B4D8;
            --deep-navy: #0B1E33;
            --energy-orange: #FF6B35;
            --bg-start: #F8F9FA;
            --bg-end: #FFFFFF;
            --glass-white: rgba(255, 255, 255, 0.7);
            --grid-color: rgba(74, 47, 107, 0.05);
            --error-red: #dc2626;
            --success-green: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: radial-gradient(circle at 10% 20%, rgba(212, 175, 55, 0.03) 0%, transparent 30%),
                        radial-gradient(circle at 90% 70%, rgba(0, 180, 216, 0.05) 0%, transparent 40%),
                        linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            padding: 1rem;
        }

        /* خلفية شبكية */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        /* Orbs ملونة */
        .orb {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
        }

        .orb-1 {
            background: rgba(212, 175, 55, 0.15);
            top: -100px;
            right: -100px;
        }

        .orb-2 {
            background: rgba(0, 180, 216, 0.12);
            bottom: -100px;
            left: -100px;
            width: 400px;
            height: 400px;
        }

        .orb-3 {
            background: rgba(74, 47, 107, 0.1);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 500px;
        }

        /* أيقونات عائمة */
        .floating-icons {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .floating-icon {
            position: absolute;
            color: var(--royal-gold);
            opacity: 0.1;
            font-size: 2rem;
            animation: float 8s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(5deg); }
        }

        /* الحاوية الزجاجية */
        .glass-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 550px;
            margin: 0 auto;
            background: var(--glass-white);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 60px;
            border: 1px solid var(--royal-gold);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(212, 175, 55, 0.2);
            padding: 2rem 1.8rem;
        }

        /* شارة ذهبية */
        .header-badge {
            display: inline-block;
            padding: 0.5rem 1.8rem;
            background: linear-gradient(145deg, rgba(212, 175, 55, 0.1), rgba(255, 255, 255, 0.5));
            border: 1.5px solid var(--royal-gold);
            border-radius: 60px;
            margin-bottom: 2rem;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            color: var(--academic-purple);
            font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
        }

        .header-badge i {
            color: var(--royal-gold);
            margin-left: 0.5rem;
        }

        /* العنوان */
        h1 {
            font-family: 'Changa', sans-serif;
            font-weight: 900;
            font-size: 2rem;
            margin-bottom: 1.5rem;
            color: var(--academic-purple);
        }

        h1 .gradient-text {
            background: linear-gradient(135deg, var(--royal-gold) 0%, var(--energy-orange) 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* حقول النموذج */
        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            color: var(--deep-navy);
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }

        label i {
            color: var(--royal-gold);
            margin-left: 0.5rem;
        }

        input, select {
            width: 100%;
            padding: 1rem 1.2rem;
            font-family: 'Tajawal', sans-serif;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 40px;
            outline: none;
            transition: all 0.3s ease;
            color: var(--deep-navy);
        }

        input:focus, select:focus {
            border-color: var(--royal-gold);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.2);
        }

        /* خيارات نعم/لا */
        .radio-group {
            display: flex;
            gap: 2rem;
            align-items: center;
            background: rgba(255, 255, 255, 0.5);
            padding: 0.8rem 1.5rem;
            border-radius: 40px;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            font-weight: 500;
        }

        .radio-option input[type="radio"] {
            width: 20px;
            height: 20px;
            accent-color: var(--royal-gold);
        }

        /* المجموعات الاختيارية (للمرحلة الابتدائية) */
        .groups-section {
            background: linear-gradient(145deg, rgba(212, 175, 55, 0.1), rgba(255, 255, 255, 0.5));
            padding: 1.5rem;
            border-radius: 50px;
            margin: 1.5rem 0;
            border: 1px solid var(--royal-gold);
            display: none;
            animation: slideDown 0.5s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .groups-title {
            font-family: 'Cairo', sans-serif;
            color: var(--academic-purple);
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .group-badges {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .group-badge {
            flex: 1;
            min-width: 120px;
            padding: 1rem;
            background: white;
            border: 2px solid var(--student-cyan);
            border-radius: 40px;
            text-align: center;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            color: var(--deep-navy);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .group-badge input[type="radio"] {
            display: none;
        }

        .group-badge:has(input:checked) {
            background: var(--student-cyan);
            color: white;
            border-color: var(--royal-gold);
            transform: scale(1.05);
            box-shadow: 0 10px 20px -10px var(--student-cyan);
        }

        /* زر الدخول */
        .submit-button {
            width: 100%;
            padding: 1.3rem;
            background: linear-gradient(145deg, var(--academic-purple), #2D1B40);
            color: white;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            border: 2px solid var(--royal-gold);
            border-radius: 80px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
        }

        .submit-button i {
            color: var(--royal-gold);
            transition: transform 0.3s ease;
        }

        .submit-button:hover {
            transform: scale(1.02) translateY(-3px);
            box-shadow: 0 25px 40px -12px var(--academic-purple);
        }

        .submit-button:hover i {
            transform: translateX(-5px);
        }

        .submit-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* رسائل الخطأ والنجاح */
        .error-message {
            color: var(--error-red);
            font-size: 0.9rem;
            margin-top: 0.3rem;
            padding-right: 1rem;
            font-family: 'Tajawal', sans-serif;
            display: none;
        }

        .success-message {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success-green);
            padding: 1rem;
            border-radius: 40px;
            text-align: center;
            margin: 1rem 0;
            border: 1px solid var(--success-green);
            display: none;
            font-family: 'Cairo', sans-serif;
        }

        /* تحميل */
        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid var(--royal-gold);
            border-bottom-color: transparent;
            border-radius: 50%;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* تحسين للهواتف */
        @media (max-width: 380px) {
            .glass-container {
                padding: 1.5rem 1rem;
            }
            
            h1 {
                font-size: 1.6rem;
            }
            
            .group-badge {
                min-width: 100%;
            }
        }

        /* تأثير ظهور */
        .glass-container {
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <!-- Orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    
    <!-- أيقونات عائمة -->
    <div class="floating-icons">
        <i class="fas fa-user-graduate floating-icon" style="top: 20%; left: 10%;"></i>
        <i class="fas fa-phone-alt floating-icon" style="top: 60%; right: 5%; color: var(--student-cyan);"></i>
        <i class="fas fa-calendar-alt floating-icon" style="top: 40%; left: 80%;"></i>
    </div>

    <!-- نموذج التسجيل -->
    <div class="glass-container">
        <div class="header-badge">
            <i class="fas fa-user-edit"></i> تسجيل البيانات
        </div>

        <h1>
            <span class="gradient-text">مرحباً بك</span><br>
            <span style="font-size: 1.5rem;">سجل بياناتك للدخول</span>
        </h1>

        <!-- رسالة النجاح -->
        <div class="success-message" id="successMessage">
            <i class="fas fa-check-circle"></i> تم حفظ بياناتك بنجاح! جاري تحويلك...
        </div>

        <form id="studentForm">
            <!-- اسم الطالب -->
            <div class="form-group">
                <label><i class="fas fa-user"></i> اسم الطالب</label>
                <input type="text" id="studentName" placeholder="أدخل الاسم كاملاً" required>
                <div class="error-message" id="nameError">يرجى إدخال الاسم</div>
            </div>

            <!-- المرحلة الدراسية -->
            <div class="form-group">
                <label><i class="fas fa-graduation-cap"></i> المرحلة الدراسية</label>
                <select id="gradeLevel" required>
                    <option value="">اختر المرحلة الدراسية</option>
                    <option value="الرابع الابتدائي">الصف الرابع الابتدائي</option>
                    <option value="الخامس الابتدائي">الصف الخامس الابتدائي</option>
                    <option value="السادس الابتدائي">الصف السادس الابتدائي</option>
                    <option value="الأول الاعدادي">الصف الأول الإعدادي</option>
                    <option value="الثاني الاعدادي">الصف الثاني الإعدادي</option>
                    <option value="الثالث الاعدادي">الصف الثالث الإعدادي</option>
                    <option value="الأول الثانوي">الصف الأول الثانوي</option>
                    <option value="الثاني الثانوي">الصف الثاني الثانوي</option>
                    <option value="الثالث الثانوي">الصف الثالث الثانوي</option>
                </select>
            </div>

            <!-- رقم الهاتف -->
            <div class="form-group">
                <label><i class="fas fa-phone"></i> رقم الهاتف</label>
                <input type="tel" id="phoneNumber" placeholder="أدخل رقم الهاتف" required>
                <div class="error-message" id="phoneError">يرجى إدخال رقم هاتف صحيح</div>
            </div>

            <!-- هل أنت معايا في الدروس؟ -->
            <div class="form-group">
                <label><i class="fas fa-question-circle"></i> هل أنت معايا في الدروس؟</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="hasLessons" value="yes" required> نعم
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="hasLessons" value="no" required> لا
                    </label>
                </div>
            </div>

            <!-- المجموعات (تظهر فقط للصف الرابع الابتدائي) -->
            <div class="groups-section" id="groupsSection">
                <div class="groups-title">
                    <i class="fas fa-users" style="color: var(--royal-gold);"></i>
                    اختر المجموعة المناسبة:
                </div>
                <div class="group-badges">
                    <label class="group-badge">
                        <input type="radio" name="group" value="السبت"> مجموعة يوم السبت
                    </label>
                    <label class="group-badge">
                        <input type="radio" name="group" value="الثلاثاء"> مجموعة يوم الثلاثاء
                    </label>
                    <label class="group-badge">
                        <input type="radio" name="group" value="الخميس"> مجموعة يوم الخميس
                    </label>
                </div>
            </div>

            <!-- زر الدخول -->
            <button type="submit" class="submit-button" id="submitBtn">
                <span>دخول</span>
                <i class="fas fa-arrow-left"></i>
                <span class="loader" id="loader"></span>
            </button>
        </form>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        // Import Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBPgtF_GqT95QkMwwoJMGiZWFPjHFdA_N0",
            authDomain: "manassa-oloom.firebaseapp.com",
            databaseURL: "https://manassa-oloom-default-rtdb.firebaseio.com",
            projectId: "manassa-oloom",
            storageBucket: "manassa-oloom.firebasestorage.app",
            messagingSenderId: "475047988456",
            appId: "1:475047988456:web:ab25a9b01b5c77483b0d5d",
            measurementId: "G-F0N011WQB9"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // التحقق من وجود بيانات مخزنة مسبقاً
        (function() {
            const savedData = localStorage.getItem('studentData');
            if (savedData) {
                // إذا وجدت بيانات، انتقل مباشرة إلى home.html
                window.location.href = 'home.html';
            }
        })();

        // عناصر DOM
        const form = document.getElementById('studentForm');
        const gradeSelect = document.getElementById('gradeLevel');
        const groupsSection = document.getElementById('groupsSection');
        const hasLessonsRadios = document.querySelectorAll('input[name="hasLessons"]');
        const submitBtn = document.getElementById('submitBtn');
        const loader = document.getElementById('loader');
        const successMessage = document.getElementById('successMessage');
        const studentName = document.getElementById('studentName');
        const phoneNumber = document.getElementById('phoneNumber');

        // عرض المجموعات عند اختيار الصف الرابع الابتدائي مع نعم
        function toggleGroups() {
            const hasLessons = document.querySelector('input[name="hasLessons"]:checked')?.value;
            const isFourthGrade = gradeSelect.value === 'الرابع الابتدائي';
            
            if (hasLessons === 'yes' && isFourthGrade) {
                groupsSection.style.display = 'block';
            } else {
                groupsSection.style.display = 'none';
            }
        }

        // حدث تغيير المرحلة الدراسية
        gradeSelect.addEventListener('change', toggleGroups);

        // حدث تغيير خيار الدروس
        hasLessonsRadios.forEach(radio => {
            radio.addEventListener('change', toggleGroups);
        });

        // التحقق من صحة البيانات
        function validateForm() {
            let isValid = true;

            // التحقق من الاسم
            if (!studentName.value.trim()) {
                document.getElementById('nameError').style.display = 'block';
                isValid = false;
            } else {
                document.getElementById('nameError').style.display = 'none';
            }

            // التحقق من رقم الهاتف (أرقام فقط و10-11 رقم)
            const phoneRegex = /^[0-9]{10,11}$/;
            if (!phoneRegex.test(phoneNumber.value.trim())) {
                document.getElementById('phoneError').style.display = 'block';
                isValid = false;
            } else {
                document.getElementById('phoneError').style.display = 'none';
            }

            // التحقق من اختيار المرحلة
            if (!gradeSelect.value) {
                isValid = false;
            }

            // التحقق من اختيار هل في الدروس
            const hasLessons = document.querySelector('input[name="hasLessons"]:checked');
            if (!hasLessons) {
                isValid = false;
            }

            // التحقق من اختيار المجموعة إذا كانت ظاهرة ومطلوبة
            if (groupsSection.style.display === 'block') {
                const groupSelected = document.querySelector('input[name="group"]:checked');
                if (!groupSelected) {
                    isValid = false;
                }
            }

            return isValid;
        }

        // حفظ البيانات في Firestore
        async function saveToFirestore(studentData) {
            try {
                // إضافة إلى مجموعة students
                const docRef = await addDoc(collection(db, "students"), studentData);
                console.log("تم حفظ البيانات بنجاح مع ID: ", docRef.id);
                return true;
            } catch (error) {
                console.error("خطأ في حفظ البيانات: ", error);
                return false;
            }
        }

        // معالجة تقديم النموذج
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!validateForm()) {
                return;
            }

            // تجميع البيانات
            const studentData = {
                name: studentName.value.trim(),
                grade: gradeSelect.value,
                phone: phoneNumber.value.trim(),
                hasLessons: document.querySelector('input[name="hasLessons"]:checked').value,
                timestamp: new Date().toISOString()
            };

            // إضافة المجموعة إذا تم اختيارها
            if (groupsSection.style.display === 'block') {
                const groupSelected = document.querySelector('input[name="group"]:checked');
                if (groupSelected) {
                    studentData.group = groupSelected.value;
                }
            }

            // عرض التحميل
            submitBtn.disabled = true;
            loader.style.display = 'inline-block';
            submitBtn.querySelector('span:first-child').style.opacity = '0.6';

            // حفظ في Firestore
            const saved = await saveToFirestore(studentData);

            if (saved) {
                // حفظ في localStorage
                localStorage.setItem('studentData', JSON.stringify(studentData));

                // عرض رسالة النجاح
                successMessage.style.display = 'block';

                // انتظار ثم التوجيه
                setTimeout(() => {
                    window.location.href = 'home.html';
                }, 1500);
            } else {
                alert('حدث خطأ في حفظ البيانات. يرجى المحاولة مرة أخرى.');
                submitBtn.disabled = false;
                loader.style.display = 'none';
                submitBtn.querySelector('span:first-child').style.opacity = '1';
            }
        });
    </script>
</body>
</html>
