<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>منصة إسماعيل عماد • 
</title>
  <!-- Font Awesome 6 (minimal) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Tajawal + Cairo (خفيف) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* ---------- متغيرات ثابتة (الهوية البصرية) ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --gold: #D4AF37;
      --purple: #4A2F6B;
      --navy: #0B1E33;
      --orange: #FF6B35;
      --glass-bg: rgba(255, 255, 255, 0.75);
      --glass-border: rgba(212, 175, 55, 0.25);
      --shadow-sm: 0 6px 18px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 12px 28px -8px rgba(0, 0, 0, 0.15);
      --blur-amount: 6px;  /* أقل لخفة الأداء على الهواتف */
      --radius-xl: 32px;
      --radius-lg: 24px;
      --radius-md: 18px;
    }

    body {
      font-family: 'Tajawal', sans-serif;
      background: radial-gradient(circle at 10% 20%, rgba(212,175,55,0.1) 0%, transparent 40%),
                  radial-gradient(circle at 90% 80%, rgba(74,47,107,0.08) 0%, transparent 40%),
                  #f2f5f9;
      min-height: 100vh;
      padding: 0.75rem 0.75rem 1rem;
      position: relative;
    }

    /* عناصر زخرفية خفيفة */
    .orb {
      position: fixed;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      filter: blur(60px);
      z-index: 0;
      pointer-events: none;
    }
    .orb-1 { background: rgba(212,175,55,0.2); top: -50px; right: -30px; }
    .orb-2 { background: rgba(74,47,107,0.15); bottom: -40px; left: -20px; width: 300px; height: 300px; }

    .container {
      position: relative;
      z-index: 10;
      max-width: 500px;   /* mobile-first عرض مثالي */
      margin: 0 auto;
    }

    /* ===== هيدر مدمج (compact) ===== */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--glass-bg);
      backdrop-filter: blur(var(--blur-amount));
      -webkit-backdrop-filter: blur(var(--blur-amount));
      border: 1px solid var(--glass-border);
      border-radius: 60px;
      padding: 0.4rem 0.6rem 0.4rem 1.2rem;
      margin-bottom: 1.2rem;
      box-shadow: var(--shadow-sm);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .brand-icon {
      width: 38px; height: 38px;
      background: linear-gradient(145deg, var(--purple), #2a1940);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
      font-size: 1.2rem;
      border: 1.5px solid var(--gold);
    }
    .brand-text {
      font-family: 'Cairo', sans-serif;
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--navy);
      white-space: nowrap;
    }
    .brand-text span {
      background: linear-gradient(135deg, var(--gold), var(--orange));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn-icon {
      width: 38px; height: 38px;
      background: white;
      border: 1px solid var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--purple);
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 4px 8px rgba(0,0,0,0.02);
    }
    .btn-icon:hover {
      background: var(--purple);
      color: white;
      transform: rotate(90deg);
    }

    /* ===== شاشة المراحل (بطاقات أفقية مدمجة) ===== */
    .screen {
      transition: opacity 0.25s ease, transform 0.3s;
    }
    .screen.hidden { display: none; }

    .section-title {
      font-family: 'Cairo', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 1rem;
      color: var(--navy);
      padding-right: 0.3rem;
    }
    .gradient-text {
      background: linear-gradient(135deg, var(--gold), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* بطاقات المرحلة بشكل أفقي (list cards) */
    .grades-horizontal {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      margin-bottom: 1.5rem;
    }
    .grade-card {
      background: var(--glass-bg);
      backdrop-filter: blur(var(--blur-amount));
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 0.7rem 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: 0.2s;
    }
    .grade-card:active { transform: scale(0.99); }
    .grade-card:hover { border-color: var(--gold); background: rgba(255,255,255,0.85); }

    .grade-icon-small {
      width: 48px; height: 48px;
      background: linear-gradient(145deg, var(--purple), #2d1945);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
      font-size: 1.5rem;
      border: 2px solid var(--gold);
      flex-shrink: 0;
    }
    .grade-info h3 {
      font-family: 'Cairo', sans-serif;
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--purple);
      line-height: 1.2;
    }
    .grade-info p {
      font-size: 0.85rem;
      color: var(--navy);
      opacity: 0.7;
    }

    /* ===== شاشة الفيديوهات ===== */
    .screen-header {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 1.2rem;
    }
    .back-btn {
      width: 42px; height: 42px;
      background: var(--glass-bg);
      backdrop-filter: blur(var(--blur-amount));
      border: 1.5px solid var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--purple);
      font-size: 1.2rem;
      cursor: pointer;
      flex-shrink: 0;
    }
    .current-grade {
      font-family: 'Cairo', sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      background: var(--glass-bg);
      backdrop-filter: blur(var(--blur-amount));
      padding: 0.4rem 1.5rem;
      border-radius: 40px;
      border: 1px solid var(--gold);
      color: var(--navy);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* شبكة الفيديوهات بدون هوامير زائدة */
    .videos-grid {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    /* بطاقة الفيديو المدمجة */
    .video-card {
      background: var(--glass-bg);
      backdrop-filter: blur(var(--blur-amount));
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: var(--navy);
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      border: 0;
    }

    /* شارة المشاهدة */
    .video-badge {
      position: absolute;
      top: 8px; right: 8px;
      background: rgba(0,180,216,0.9);
      backdrop-filter: blur(3px);
      color: white;
      padding: 0.25rem 0.9rem;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 600;
      border: 1px solid var(--gold);
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .video-badge i { font-size: 0.6rem; color: var(--gold); }

    /* فيديو مقفول (overlay محكم) */
    .locked-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(145deg, rgba(74,47,107,0.97), rgba(11,30,51,0.97));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      backdrop-filter: blur(3px);
      padding: 0 1rem;
      text-align: center;
    }
    .locked-overlay i {
      font-size: 2.2rem;
      color: var(--gold);
      margin-bottom: 0.3rem;
    }
    .locked-overlay .locked-title {
      font-family: 'Cairo', sans-serif;
      font-size: 1rem;
      font-weight: 700;
    }
    .locked-overlay .locked-reason {
      font-size: 0.75rem;
      background: rgba(255,215,0,0.15);
      padding: 0.2rem 1rem;
      border-radius: 30px;
      border: 1px solid var(--gold);
      margin-top: 0.3rem;
      max-width: 90%;
    }

    .video-info {
      padding: 0.7rem 1rem 0.9rem;
    }
    .video-title {
      font-family: 'Cairo', sans-serif;
      font-size: 1rem;  /* 16px */
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 0.2rem;
      line-height: 1.3;
    }
    .video-meta {
      font-size: 0.7rem;  /* ~12px */
      color: var(--purple);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      opacity: 0.8;
    }

    /* الحالات الفارغة و loader */
    .empty-state {
      background: var(--glass-bg);
      backdrop-filter: blur(var(--blur-amount));
      border-radius: var(--radius-lg);
      padding: 2rem 1rem;
      text-align: center;
      border: 1px dashed var(--gold);
    }
    .empty-state i { font-size: 3.5rem; color: var(--gold); opacity: 0.5; }
    .empty-state h3 { font-size: 1.2rem; color: var(--navy); }

    .loader-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2.5rem 0;
    }
    .loader {
      width: 44px; height: 44px;
      border: 4px solid var(--gold);
      border-bottom-color: transparent;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast صغير */
    .toast {
      position: fixed;
      bottom: 16px; left: 16px; right: 16px;
      max-width: 320px;
      margin: 0 auto;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      border: 2px solid var(--gold);
      border-radius: 60px;
      padding: 0.8rem 1.2rem;
      color: var(--navy);
      font-weight: 600;
      box-shadow: var(--shadow-md);
      transform: translateY(150%);
      transition: transform 0.3s ease;
      z-index: 1100;
      text-align: center;
      font-size: 0.95rem;
    }
    .toast.show { transform: translateY(0); }
    .toast i { margin-left: 0.5rem; color: var(--gold); }

    /* footer صغير */
    .footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--navy);
      opacity: 0.5;
      border-top: 1px solid rgba(212,175,55,0.2);
      padding-top: 0.8rem;
    }

    /* لا هوامير زائدة */
    @media (max-width: 380px) {
      .brand-text { font-size: 0.95rem; }
      .current-grade { font-size: 1rem; padding: 0.4rem 1rem; }
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="container">
    <!-- هيدر مدمج مع زر التحديث -->
    <div class="header">
      <div class="brand">
        <div class="brand-icon"><i class="fas fa-graduation-cap"></i></div>
        <div class="brand-text"><span>أكاديمية</span> إسماعيل عماد</div>
      </div>
      <div class="btn-icon" id="refreshBtn" title="تحديث"><i class="fas fa-sync-alt"></i></div>
    </div>

    <!-- ===== شاشة اختيار المرحلة (بطاقات أفقية) ===== -->
    <div id="selectionScreen" class="screen">
      <h2 class="section-title"><span class="gradient-text">📚 المرحلة</span></h2>
      <div class="grades-horizontal">
        <div class="grade-card" data-grade="الصف الرابع الابتدائي">
          <div class="grade-icon-small"><i class="fas fa-child"></i></div>
          <div class="grade-info">
            <h3>الرابع الابتدائي</h3>
            <p> </p>
          </div>
        </div>
        <div class="grade-card" data-grade="الصف الأول الإعدادي">
          <div class="grade-icon-small"><i class="fas fa-user-graduate"></i></div>
          <div class="grade-info">
            <h3>الأول الإعدادي</h3>
            <p> </p>
          </div>
        </div>
        <div class="grade-card" data-grade="الصف الثالث الإعدادي">
          <div class="grade-icon-small"><i class="fas fa-star"></i></div>
          <div class="grade-info">
            <h3>الثالث الإعدادي</h3>
            <p> </p>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== شاشة عرض الفيديوهات ===== -->
    <div id="videosScreen" class="screen hidden">
      <div class="screen-header">
        <div class="back-btn" id="backBtn"><i class="fas fa-arrow-right"></i></div>
        <div class="current-grade" id="currentGradeDisplay"></div>
      </div>
      <div id="videosGrid" class="videos-grid"><!-- تملأ ديناميكياً --></div>
    </div>

    <div class="footer">منصة  • أ. إسماعيل عماد</div>
  </div>

  <div id="toast" class="toast"><i class="fas fa-check-circle"></i> <span id="toastMessage"></span></div>

  <!-- Firebase SDK 10.7 (modular) -->
  <script type="module">
    // ==================== إعداد Firebase v10 ====================
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBPgtF_GqT95QkMwwoJMGiZWFPjHFdA_N0",
      authDomain: "manassa-oloom.firebaseapp.com",
      databaseURL: "https://manassa-oloom-default-rtdb.firebaseio.com",
      projectId: "manassa-oloom",
      storageBucket: "manassa-oloom.firebasestorage.app",
      messagingSenderId: "475047988456",
      appId: "1:475047988456:web:ab25a9b01b5c77483b0d5d"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ---------- ثوابت ----------
    const CACHE_KEY = 'video_cache_v2';      // تخزين session
    const WATCHED_KEY = 'watched_videos';
    const CACHE_DURATION = 2 * 60 * 60 * 1000; // ساعتين

    // عناصر DOM
    const selectionScreen = document.getElementById('selectionScreen');
    const videosScreen = document.getElementById('videosScreen');
    const videosGrid = document.getElementById('videosGrid');
    const currentGradeSpan = document.getElementById('currentGradeDisplay');
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMessage');
    const refreshBtn = document.getElementById('refreshBtn');
    const backBtn = document.getElementById('backBtn');

    let currentGrade = '';   // المرحلة الحالية

    // ---------- دوال مساعدة ----------
    const showToast = (msg, icon = 'check-circle') => {
      toastMsg.innerText = msg;
      toast.innerHTML = `<i class="fas fa-${icon}"></i> <span>${msg}</span>`;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2700);
    };

    // دالة ذكية لتحويل أي رابط يوتيوب إلى embed
    const getYoutubeEmbed = (url) => {
      if (!url) return '';
      const patterns = [
        /(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&?#]+)/,
        /youtube\.com\/embed\/([^/?]+)/,
        /youtube\.com\/shorts\/([^/?]+)/
      ];
      for (let p of patterns) {
        const match = url.match(p);
        if (match && match[1]) return `https://www.youtube.com/embed/${match[1]}`;
      }
      return url; // fallback
    };

    // إدارة المشاهدات
    const markAsWatched = (videoId) => {
      let watched = JSON.parse(localStorage.getItem(WATCHED_KEY) || '[]');
      if (!watched.includes(videoId)) {
        watched.push(videoId);
        localStorage.setItem(WATCHED_KEY, JSON.stringify(watched));
        showToast('تم تسجيل المشاهدة ✅');
      }
    };
    const isWatched = (videoId) => {
      const watched = JSON.parse(localStorage.getItem(WATCHED_KEY) || '[]');
      return watched.includes(videoId);
    };
    window.markAsWatched = markAsWatched; // للاستخدام من iframe (onclick)

    // إدارة الكاش (مع تحويل Timestamp إلى string)
    const saveToCache = (grade, videos) => {
      const cache = JSON.parse(sessionStorage.getItem(CACHE_KEY) || '{}');
      // تحويل التواريخ لنص آمن
      const safeVideos = videos.map(v => ({
        ...v,
        createdAt: v.createdAt?.toDate ? v.createdAt.toDate().toISOString() : (v.createdAt || new Date().toISOString())
      }));
      cache[grade] = {
        videos: safeVideos,
        timestamp: Date.now()
      };
      sessionStorage.setItem(CACHE_KEY, JSON.stringify(cache));
    };

    const getFromCache = (grade) => {
      const cache = JSON.parse(sessionStorage.getItem(CACHE_KEY) || '{}');
      const entry = cache[grade];
      if (!entry) return null;
      if (Date.now() - entry.timestamp > CACHE_DURATION) return null;
      return entry.videos; // مصفوفة آمنة
    };

    // ترتيب المصفوفة تنازلياً حسب التاريخ (من الأحدث)
    const sortVideosByDate = (videos) => {
      return videos.sort((a, b) => {
        const dateA = a.createdAt ? new Date(a.createdAt).getTime() : 0;
        const dateB = b.createdAt ? new Date(b.createdAt).getTime() : 0;
        return dateB - dateA;
      });
    };

    // عرض تاريخ مقروء من الصيغة المخزنة (ISO أو Timestamp)
    const formatDate = (dateInput) => {
      if (!dateInput) return 'تاريخ غير متاح';
      try {
        if (dateInput.toDate) dateInput = dateInput.toDate(); // في حال كان Timestamp مباشر
        const d = new Date(dateInput);
        if (isNaN(d.getTime())) return 'تاريخ غير متاح';
        return d.toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric' });
      } catch {
        return 'تاريخ غير متاح';
      }
    };

    // عرض الفيديوهات في الـ grid
    const displayVideos = (videos) => {
      if (!videos || videos.length === 0) {
        videosGrid.innerHTML = `<div class="empty-state"><i class="fas fa-video-slash"></i><h3>لا توجد فيديوهات</h3><p>سيتم إضافة محتوى قريباً</p></div>`;
        return;
      }

      let html = '';
      videos.forEach(v => {
        const embedUrl = getYoutubeEmbed(v.youtubeUrl);
        const watched = isWatched(v.id);
        const dateStr = formatDate(v.createdAt);

        if (v.isActive) {
          // فيديو نشط
          html += `<div class="video-card">
            <div class="video-wrapper">
              ${watched ? '<div class="video-badge"><i class="fas fa-check-circle"></i> تمت المشاهدة</div>' : ''}
              <iframe src="${embedUrl}" frameborder="0" allowfullscreen allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture"></iframe>
            </div>
            <div class="video-info">
              <div class="video-title">${v.title || 'فيديو تعليمي'}</div>
              <div class="video-meta"><i class="far fa-calendar-alt"></i> ${dateStr}</div>
            </div>
          </div>`;
        } else {
          // فيديو مقفول
          const reason = v.inactiveReason || 'سيُفتح قريباً';
          html += `<div class="video-card">
            <div class="video-wrapper">
              <div class="locked-overlay">
                <i class="fas fa-lock"></i>
                <span class="locked-title">مقفول 🔒</span>
                <span class="locked-reason">${reason}</span>
              </div>
            </div>
            <div class="video-info">
              <div class="video-title">${v.title || 'فيديو تعليمي'}</div>
              <div class="video-meta"><i class="far fa-calendar-alt"></i> ${dateStr}</div>
            </div>
          </div>`;
        }
      });
      videosGrid.innerHTML = html;

      // إضافة مستمع لتسجيل المشاهدة (اختياري) عبر onclick في iframe غير ممكن بسبب cross-origin، لذلك نضيف click على الـ iframe لمحاكاة (ليس دقيقاً)
      // بدلاً من ذلك نضيف زر أو حدث عند الضغط على الفيديو (لكن المستخدم قد لا "يشاهد" كاملاً). سنكتفي بشارة المشاهدة عبر localStorage عبر زر اختياري؟
      // الأفضل أن نجعل المستخدم يضغط على أيقونة اختيارية. لكن حسب الطلب: نحتفظ بالنظام القديم onclick على iframe.
      // نضيف onclick للـ iframe عبر إعادة كتابة السمة.
      document.querySelectorAll('.video-wrapper iframe').forEach((iframe, idx) => {
        iframe.setAttribute('onclick', `markAsWatched('${videos[idx].id}')`);
      });
    };

    // تحميل الفيديوهات من Firebase (بدون orderBy لتجنب index)
    const fetchVideosFromFB = async (grade) => {
      try {
        const q = query(collection(db, "platform_videos"), where("grade", "==", grade));
        const snap = await getDocs(q);
        const videos = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        // ترتيب برمجي تنازلي حسب createdAt (افترض أنه Timestamp أو string)
        return sortVideosByDate(videos);
      } catch (err) {
        console.error("Firestore error", err);
        throw err;
      }
    };

    // دالة تحميل الفيديوهات (تستدعى عند اختيار مرحلة)
    window.loadVideos = async (grade) => {
      currentGrade = grade;
      currentGradeSpan.innerText = grade;
      selectionScreen.classList.add('hidden');
      videosScreen.classList.remove('hidden');

      // عرض loader
      videosGrid.innerHTML = `<div class="loader-container"><div class="loader"></div></div>`;

      try {
        // 1. حاول من الكاش
        let videos = getFromCache(grade);
        if (!videos) {
          showToast('جلب من Firebase 🔄', 'cloud-download-alt');
          videos = await fetchVideosFromFB(grade);
          saveToCache(grade, videos);  // نخزن مع تحويل التواريخ لنص
        } else {
          console.log('✅ من الكاش:', grade);
        }

        displayVideos(videos);
      } catch (err) {
        console.error(err);
        videosGrid.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><h3>تعذر التحميل</h3><p>حاول مرة أخرى</p></div>`;
        showToast('خطأ في الاتصال', 'exclamation-triangle');
      }
    };

    // العودة لاختيار المرحلة
    backBtn.addEventListener('click', () => {
      videosScreen.classList.add('hidden');
      selectionScreen.classList.remove('hidden');
      currentGrade = '';
    });

    // أحداث بطاقات المرحلة
    document.querySelectorAll('.grade-card').forEach(card => {
      card.addEventListener('click', () => {
        const grade = card.dataset.grade;
        loadVideos(grade);
      });
    });

    // زر التحديث: يمسح كاش المرحلة الحالية ويعيد التحميل
    refreshBtn.addEventListener('click', () => {
      if (!currentGrade) {
        showToast('اختر مرحلة أولاً', 'info-circle');
        return;
      }
      // مسح كاش هذه المرحلة
      const cache = JSON.parse(sessionStorage.getItem(CACHE_KEY) || '{}');
      if (cache[currentGrade]) {
        delete cache[currentGrade];
        sessionStorage.setItem(CACHE_KEY, JSON.stringify(cache));
      }
      showToast('تحديث البيانات 🔄', 'sync-alt');
      loadVideos(currentGrade);
    });

    // توجيه دالة markAsWatched للعالمي
    window.markAsWatched = markAsWatched;

    // التحقق من وجود بيانات طالب (اختياري)
    // if (!localStorage.getItem('studentData')) { window.location.href = 'index2.html'; }
  </script>
</body>
</html>
