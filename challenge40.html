<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>أكاديمية إسماعيل عماد | مغامرة الصف الرابع - الملحمة الكبرى</title>
    
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- GSAP المتقدم -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        /* ===== المتغيرات المحسنة ===== */
        :root {
            --primary-gold: #D4AF37;
            --primary-gold-light: #f5d97b;
            --primary-gold-dark: #b88c1f;
            --primary-dark: #0B1E33;
            --primary-darker: #030812;
            --error-red: #ff4444;
            --success-green: #28a745;
            --energy-blue: #00d4ff;
            --magic-purple: #9d4edd;
            --transition-smooth: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at top, #1a2f44, var(--primary-darker));
            position: relative;
            overflow-x: hidden;
            color: white;
        }

        /* ===== خلفية كونية متحركة 3D ===== */
        .cosmic-bg {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(2px 2px at 20px 30px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 80px 120px, #D4AF37, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 50px, #fff, rgba(0,0,0,0)),
                radial-gradient(4px 4px at 250px 180px, #D4AF37, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 350px 250px, #00d4ff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 450px 90px, #9d4edd, rgba(0,0,0,0));
            background-size: 500px 500px;
            opacity: 0.5;
            animation: cosmicSpin 180s linear infinite;
            z-index: -2;
        }

        @keyframes cosmicSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ===== سحب متحركة ===== */
        .nebula {
            position: fixed;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 30% 50%, rgba(212, 175, 55, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 70% 30%, rgba(0, 212, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 20% 80%, rgba(157, 78, 221, 0.1) 0%, transparent 50%);
            filter: blur(40px);
            animation: nebulaFloat 20s ease-in-out infinite alternate;
            z-index: -1;
        }

        @keyframes nebulaFloat {
            0% { transform: scale(1) rotate(0deg); opacity: 0.3; }
            100% { transform: scale(1.2) rotate(5deg); opacity: 0.6; }
        }

        /* ===== شريط الحالة المحسن ===== */
        .epic-status-bar {
            background: rgba(11, 30, 51, 0.85);
            backdrop-filter: blur(20px) saturate(200%);
            border-bottom: 2px solid var(--primary-gold);
            padding: 15px 25px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 10px 40px -10px rgba(212, 175, 55, 0.3);
        }

        .player-profile {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .player-avatar {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary-gold), #b88c1f);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: var(--primary-dark);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
            animation: avatarPulse 2s infinite;
        }

        @keyframes avatarPulse {
            0%, 100% { box-shadow: 0 0 30px rgba(212, 175, 55, 0.5); }
            50% { box-shadow: 0 0 50px rgba(212, 175, 55, 0.8); }
        }

        .player-name {
            font-size: 22px;
            font-weight: 900;
            background: linear-gradient(135deg, #fff, var(--primary-gold-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .player-title {
            font-size: 14px;
            color: rgba(255,255,255,0.6);
            margin-top: -5px;
        }

        /* ===== قلوب متطورة ===== */
        .hearts-epic {
            display: flex;
            gap: 8px;
            background: rgba(0,0,0,0.3);
            padding: 8px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255,68,68,0.3);
        }

        .heart-epic {
            font-size: 30px;
            filter: drop-shadow(0 0 10px #ff4444);
            transition: all 0.3s ease;
        }

        .heart-epic.lost {
            opacity: 0.2;
            filter: none;
        }

        .heart-epic.beat {
            animation: heartBeat 0.5s ease;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            30% { transform: scale(1.4); color: #ff6b6b; }
        }

        /* ===== النقاط الذهبية ===== */
        .points-epic {
            background: linear-gradient(135deg, rgba(212,175,55,0.2), rgba(212,175,55,0.05));
            border: 2px solid var(--primary-gold);
            border-radius: 50px;
            padding: 8px 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }

        .points-epic::before {
            content: '';
            position: absolute;
            top: -20px;
            left: -20px;
            width: 60px;
            height: 60px;
            background: var(--primary-gold);
            filter: blur(30px);
            animation: pointsGlow 2s infinite;
        }

        @keyframes pointsGlow {
            0%, 100% { transform: translate(0,0); opacity: 0.3; }
            50% { transform: translate(30px,30px); opacity: 0.6; }
        }

        .points-epic i {
            font-size: 28px;
            color: var(--primary-gold);
            animation: pointsSpin 10s linear infinite;
        }

        @keyframes pointsSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .points-epic span {
            font-size: 32px;
            font-weight: 900;
            color: var(--primary-gold);
            text-shadow: 0 0 20px rgba(212,175,55,0.5);
        }

        /* ===== شاشة التحميل الملحمية (معدلة - تختفي بسرعة) ===== */
        .loading-epic {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--primary-darker);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .loading-epic.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .portal-loader {
            width: 200px;
            height: 200px;
            position: relative;
            perspective: 1000px;
            margin-bottom: 40px;
        }

        .portal-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 4px solid transparent;
            border-top-color: var(--primary-gold);
            border-bottom-color: var(--energy-blue);
            border-radius: 50%;
            animation: portalSpin 2s linear infinite;
        }

        .portal-ring:nth-child(2) {
            width: 80%;
            height: 80%;
            top: 10%;
            left: 10%;
            border-top-color: var(--magic-purple);
            border-bottom-color: var(--primary-gold-light);
            animation-direction: reverse;
            animation-duration: 1.5s;
        }

        .portal-ring:nth-child(3) {
            width: 60%;
            height: 60%;
            top: 20%;
            left: 20%;
            border-top-color: var(--energy-blue);
            border-bottom-color: var(--magic-purple);
            animation-duration: 1s;
        }

        @keyframes portalSpin {
            0% { transform: rotateY(0deg) rotateX(0deg); }
            100% { transform: rotateY(360deg) rotateX(360deg); }
        }

        .loading-tip-epic {
            background: rgba(212,175,55,0.1);
            border: 2px solid var(--primary-gold);
            border-radius: 60px;
            padding: 20px 40px;
            font-size: 22px;
            color: white;
            box-shadow: 0 0 50px rgba(212,175,55,0.2);
            animation: tipGlow 2s infinite;
        }

        /* ===== خريطة المراحل ثلاثية الأبعاد ===== */
        .world-map {
            max-width: 1300px;
            margin: 30px auto;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        .map-title {
            text-align: center;
            margin-bottom: 50px;
            position: relative;
        }

        .map-title h1 {
            font-size: clamp(40px, 9vw, 70px);
            font-weight: 900;
            background: linear-gradient(135deg, 
                var(--primary-gold), 
                var(--energy-blue), 
                var(--magic-purple), 
                var(--primary-gold-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 50px rgba(212,175,55,0.3);
            margin-bottom: 20px;
            animation: titleWave 3s infinite;
        }

        @keyframes titleWave {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .map-subtitle {
            color: rgba(255,255,255,0.7);
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .magic-line {
            height: 3px;
            width: 100px;
            background: linear-gradient(90deg, transparent, var(--primary-gold), var(--energy-blue), var(--magic-purple), transparent);
        }

        /* ===== بطاقات المراحل المحسنة مع حالة التحميل ===== */
        .stages-epic-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            padding: 20px;
            perspective: 2000px;
        }

        .stage-epic-card {
            background: rgba(11, 30, 51, 0.4);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(212, 175, 55, 0.2);
            border-radius: 50px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
            box-shadow: 0 20px 40px -15px rgba(0,0,0,0.5);
        }

        .stage-epic-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, 
                transparent, 
                var(--primary-gold), 
                var(--energy-blue), 
                var(--magic-purple), 
                transparent);
            transform: translateX(-100%);
            transition: transform 0.8s ease;
        }

        .stage-epic-card:hover {
            transform: translateY(-20px) rotateX(5deg) scale(1.05);
            border-color: var(--primary-gold);
            box-shadow: 0 30px 60px -15px rgba(212,175,55,0.5);
        }

        .stage-epic-card:hover::before {
            transform: translateX(100%);
        }

        .stage-epic-card.unlocked {
            border-color: var(--primary-gold);
            background: rgba(212, 175, 55, 0.1);
            animation: cardBreath 3s infinite;
        }

        @keyframes cardBreath {
            0%, 100% { box-shadow: 0 0 30px rgba(212,175,55,0.3); }
            50% { box-shadow: 0 0 60px rgba(212,175,55,0.6); }
        }

        .stage-epic-card.completed {
            border-color: var(--success-green);
            background: rgba(40, 167, 69, 0.1);
            position: relative;
        }

        .stage-epic-card.completed::after {
            content: '✓✓';
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 24px;
            color: var(--success-green);
            font-weight: 900;
            text-shadow: 0 0 20px #28a745;
        }

        .stage-epic-card.loading {
            cursor: wait;
            opacity: 0.7;
        }

        .stage-icon-epic {
            font-size: 70px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px currentColor);
            animation: iconFloat 3s infinite;
        }

        @keyframes iconFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        .stage-number-epic {
            font-size: 28px;
            font-weight: 900;
            color: white;
            margin-bottom: 15px;
        }

        .stage-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 700;
            margin: 15px 0;
        }

        .stage-badge.unlocked {
            background: rgba(212,175,55,0.2);
            color: var(--primary-gold);
            border: 1px solid var(--primary-gold);
        }

        .stage-badge.locked {
            background: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.5);
        }

        .stage-badge.completed {
            background: rgba(40,167,69,0.2);
            color: var(--success-green);
            border: 1px solid var(--success-green);
        }

        .stage-badge.loading {
            background: rgba(212,175,55,0.1);
            color: var(--primary-gold);
            border: 1px dashed var(--primary-gold);
        }

        .stage-date {
            font-size: 14px;
            color: rgba(255,255,255,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .stage-questions-count {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: rgba(212,175,55,0.15);
            border-radius: 30px;
            padding: 6px 14px;
            font-size: 13px;
            color: var(--primary-gold);
        }

        /* ===== بقية الأنماط كما هي (ساحة المعركة، النتيجة، إلخ) ===== */
        /* (تم الحفاظ على جميع الأنماط الأخرى كما كانت) */
        
        /* ===== ساحة المعركة الملحمية ===== */
        .battle-epic-arena {
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
            position: relative;
            z-index: 50;
            display: none;
        }

        .battle-epic-arena.active {
            display: block;
            animation: arenaRise 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes arenaRise {
            0% { opacity: 0; transform: scale(0.8) translateY(100px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .battle-header-epic {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .battle-info-epic {
            background: rgba(11,30,51,0.9);
            backdrop-filter: blur(10px);
            border: 2px solid var(--primary-gold);
            border-radius: 60px;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
            overflow: hidden;
        }

        .battle-info-epic::before {
            content: '';
            position: absolute;
            width: 100px;
            height: 100px;
            background: var(--primary-gold);
            filter: blur(50px);
            opacity: 0.3;
            animation: infoFloat 3s infinite;
        }

        .battle-scene-epic {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(15px);
            border-radius: 80px;
            padding: 40px 30px;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
            min-height: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(212,175,55,0.3);
            box-shadow: 0 30px 60px -20px rgba(0,0,0,0.8), 0 0 0 2px rgba(212,175,55,0.1) inset;
        }

        .battle-effects {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .battle-particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: var(--primary-gold);
            border-radius: 50%;
            filter: blur(2px);
            animation: battleParticle 4s linear infinite;
        }

        @keyframes battleParticle {
            0% { transform: translateY(100%) scale(1); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(-100%) scale(0); opacity: 0; }
        }

        .enemy-epic {
            width: 250px;
            height: 250px;
            margin-bottom: 30px;
            position: relative;
            z-index: 10;
        }

        .enemy-epic i {
            font-size: 200px;
            filter: drop-shadow(0 0 40px currentColor);
            animation: enemyEpicFloat 3s infinite;
        }

        @keyframes enemyEpicFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.1); }
        }

        .enemy-epic.shake {
            animation: enemyShake 0.5s ease;
        }

        @keyframes enemyShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-20px); }
            75% { transform: translateX(20px); }
        }

        .battle-question-epic {
            font-size: clamp(22px, 6vw, 32px);
            font-weight: 900;
            text-align: center;
            margin: 20px 0;
            color: white;
            max-width: 800px;
            background: rgba(0,0,0,0.5);
            padding: 25px 35px;
            border-radius: 70px;
            border: 2px solid rgba(212,175,55,0.3);
            backdrop-filter: blur(10px);
            line-height: 1.6;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .options-epic-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin: 30px 0;
            perspective: 2000px;
        }

        @media (max-width: 700px) {
            .options-epic-container {
                grid-template-columns: 1fr;
            }
        }

        .option-epic-btn {
            background: rgba(11,30,51,0.9);
            backdrop-filter: blur(10px);
            border: 3px solid rgba(212,175,55,0.2);
            border-radius: 50px;
            padding: 25px 25px;
            color: white;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: right;
            display: flex;
            align-items: center;
            gap: 20px;
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
            min-height: 100px;
            width: 100%;
        }

        .option-epic-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(212,175,55,0.2), transparent);
            transition: left 0.6s ease;
        }

        .option-epic-btn:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--primary-gold);
            box-shadow: 0 20px 40px -10px rgba(212,175,55,0.4);
        }

        .option-epic-btn:hover::before {
            left: 100%;
        }

        .option-epic-btn.selected {
            background: rgba(212,175,55,0.3);
            border-color: var(--primary-gold);
            box-shadow: 0 0 60px rgba(212,175,55,0.5);
        }

        .option-epic-btn.correct {
            background: rgba(40,167,69,0.3);
            border-color: var(--success-green);
            box-shadow: 0 0 60px rgba(40,167,69,0.5);
            animation: correctEpic 0.8s ease;
        }

        .option-epic-btn.wrong {
            background: rgba(220,53,69,0.3);
            border-color: var(--error-red);
            animation: wrongEpic 0.6s ease;
        }

        @keyframes correctEpic {
            0%, 100% { transform: scale(1); }
            30% { transform: scale(1.1) rotate(2deg); filter: brightness(1.3); }
        }

        @keyframes wrongEpic {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-20px) rotate(-2deg); }
            40%, 80% { transform: translateX(20px) rotate(2deg); }
        }

        .option-prefix-epic {
            background: linear-gradient(135deg, var(--primary-gold), var(--primary-gold-light));
            color: var(--primary-dark);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 28px;
            box-shadow: 0 0 30px rgba(212,175,55,0.5);
            flex-shrink: 0;
        }

        /* ===== تأثيرات الإنجاز ===== */
        .milestone-celebration {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10000;
            pointer-events: none;
        }

        .celebration-text {
            font-size: 70px;
            font-weight: 900;
            color: var(--primary-gold);
            text-shadow: 0 0 30px var(--primary-gold), 0 0 60px var(--energy-blue);
            animation: celebrationPop 2s ease-out forwards;
            white-space: nowrap;
        }

        @keyframes celebrationPop {
            0% { opacity: 0; transform: scale(0.5); }
            20% { opacity: 1; transform: scale(1.2); }
            40% { transform: scale(1); }
            80% { opacity: 1; }
            100% { opacity: 0; transform: scale(2); }
        }

        .star-particle {
            position: absolute;
            color: var(--primary-gold);
            font-size: 24px;
            pointer-events: none;
            animation: starFly 1.5s ease-out forwards;
        }

        @keyframes starFly {
            0% { opacity: 1; transform: translate(0, 0) rotate(0deg); }
            100% { opacity: 0; transform: translate(var(--x, 100px), var(--y, -100px)) rotate(360deg); }
        }

        /* ===== شاشة النتيجة المحسنة ===== */
        .result-epic-screen {

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
    import { 
        getFirestore, 
        collection, 
        doc, 
        getDoc, 
        getDocs, 
        updateDoc, 
        serverTimestamp,
        enableIndexedDbPersistence
    } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    // ==================== تهيئة Firebase ====================
    const firebaseConfig = {
        apiKey: "AIzaSyBPgtF_GqT95QkMwwoJMGiZWFPjHFdA_N0",
        authDomain: "manassa-oloom.firebaseapp.com",
        projectId: "manassa-oloom",
        storageBucket: "manassa-oloom.firebasestorage.app",
        messagingSenderId: "475047988456",
        appId: "1:475047988456:web:ab25a9b01b5c77483b0d5d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    enableIndexedDbPersistence(db).catch(err => console.log("Persistence:", err));
    window.db = db;

    // ==================== البيانات العامة ====================
    const grade = 'grade4'; // للصف الرابع
    let studentData = null;
    let currentStage = 1;
    let currentQuestions = [];
    let currentIndex = 0;
    let hearts = 3;
    let points = 0;
    let correct = 0;
    let battleActive = false;
    
    // ==================== هيكل بيانات المراحل الجديد ====================
    const stageStatus = {
        1: { status: 'loading', unlockDate: null, questionsCount: 0, hasQuestions: false, completed: false, error: null },
        2: { status: 'loading', unlockDate: null, questionsCount: 0, hasQuestions: false, completed: false, error: null },
        3: { status: 'loading', unlockDate: null, questionsCount: 0, hasQuestions: false, completed: false, error: null },
        4: { status: 'loading', unlockDate: null, questionsCount: 0, hasQuestions: false, completed: false, error: null },
        5: { status: 'loading', unlockDate: null, questionsCount: 0, hasQuestions: false, completed: false, error: null },
        6: { status: 'loading', unlockDate: null, questionsCount: 0, hasQuestions: false, completed: false, error: null },
        7: { status: 'loading', unlockDate: null, questionsCount: 0, hasQuestions: false, completed: false, error: null },
        8: { status: 'loading', unlockDate: null, questionsCount: 0, hasQuestions: false, completed: false, error: null },
        9: { status: 'loading', unlockDate: null, questionsCount: 0, hasQuestions: false, completed: false, error: null },
        10: { status: 'loading', unlockDate: null, questionsCount: 0, hasQuestions: false, completed: false, error: null },
        11: { status: 'loading', unlockDate: null, questionsCount: 0, hasQuestions: false, completed: false, error: null },
        12: { status: 'loading', unlockDate: null, questionsCount: 0, hasQuestions: false, completed: false, error: null }
    };
    
    let achievements = [];
    
    // نصائح ملحمية
    const epicTips = [
        "🔥 السرعة = المسافة ÷ الزمن!",
        "⚡ الضوء أسرع من الصوت بمليون مرة!",
        "💧 الماء يغطي 71% من الأرض!",
        "🌍 الأرض تدور حول الشمس كل 365 يوم!",
        "🧪 الذرة تتكون من نواة وإلكترونات!",
        "🦴 جسم الإنسان 206 عظمة!",
        "❤️ القلب يضخ 5 لتر دم في الدقيقة!",
        "🧠 المخ فيه 100 مليار خلية عصبية!"
    ];

    // ==================== تهيئة المؤثرات ====================
    function initEpicEffects() {
        const effects = document.getElementById('battleEffects');
        if (effects) {
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.className = 'battle-particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDelay = Math.random() * 5 + 's';
                p.style.animationDuration = 3 + Math.random() * 4 + 's';
                effects.appendChild(p);
            }
        }
    }

    // ==================== تحميل بيانات الطالب مع الإنجازات ====================
    async function loadStudentDataEpic() {
        const local = localStorage.getItem('studentData');
        if (!local) { 
            window.location.href = 'challenge1.html'; 
            return;
        }
        
        try {
            studentData = JSON.parse(local);
            if (studentData.grade !== grade) { 
                window.location.href = 'challenge1.html'; 
                return;
            }
        } catch (e) {
            window.location.href = 'challenge1.html';
            return;
        }
        
        document.getElementById('studentNameEpic').innerText = studentData.name || 'البطل';
        
        // نظام الألقاب
        const titles = ['مغامر مبتدئ', 'فارس مغوار', 'بطل متقدم', 'أسطورة حية', 'ملك المغامرات'];
        const level = Math.floor((studentData.points || 0) / 200);
        document.getElementById('playerTitle').innerText = titles[Math.min(level, 4)] || 'أسطورة خالدة';
        
        points = studentData.points || 0;
        hearts = studentData.hearts || 3;
        currentStage = studentData.lastStage || 1;
        achievements = studentData.achievements || [];
        
        updateHeartsEpic();
        updatePointsEpic();
    }

    // ==================== عرض الخريطة فوراً (بدون انتظار) ====================
    function renderStagesMapImmediately() {
        const grid = document.getElementById('stagesEpicGrid');
        grid.innerHTML = '';
        
        const icons = ['dragon', 'flask', 'rocket', 'tree', 'skull', 'robot', 'magic', 'crown', 'shield', 'bolt', 'book', 'star'];
        
        for (let i = 1; i <= 12; i++) {
            const card = document.createElement('div');
            card.className = 'stage-epic-card loading';
            card.setAttribute('data-stage', i);
            
            card.innerHTML = `
                <div class="stage-icon-epic">
                    <i class="fas fa-spinner fa-pulse" style="color: #D4AF37;"></i>
                </div>
                <div class="stage-number-epic">الرحلة ${i}</div>
                <div class="stage-badge loading">🔍 جاري التحميل...</div>
                <div class="stage-questions-count">
                    <i class="fas fa-question-circle"></i> -- سؤال
                </div>
            `;
            
            card.onclick = () => checkAndStartStage(i);
            grid.appendChild(card);
        }
    }

    // ==================== تحميل بيانات المرحلة الواحدة في الخلفية ====================
    async function loadSingleStageData(stageNumber) {
        try {
            // التحقق من الكاش أولاً (مع صلاحية أقصر - 5 دقائق فقط)
            const cacheKey = `stage_${grade}_${stageNumber}_info`;
            const cached = localStorage.getItem(cacheKey);
            const today = new Date().toISOString().split('T')[0];
            
            if (cached) {
                const data = JSON.parse(cached);
                // إذا كان الكاش حديثاً (أقل من 5 دقائق)
                if (Date.now() - data.timestamp < 5 * 60 * 1000) {
                    stageStatus[stageNumber] = {
                        ...data.info,
                        status: 'ready'
                    };
                    updateStageCard(stageNumber);
                    return;
                }
            }
            
            // تحميل من Firebase
            const stageRef = doc(db, "adventures", grade, "stages", `stage${stageNumber}`);
            const stageSnap = await getDoc(stageRef);
            
            let qCount = 0;
            let unlockDate = null;
            let stageCompleted = studentData?.completedStages?.includes(stageNumber) || false;
            
            if (stageSnap.exists()) {
                const data = stageSnap.data();
                unlockDate = data.unlockDate;
                
                // تحميل عدد الأسئلة
                try {
                    const qRef = collection(db, "adventures", grade, "stages", `stage${stageNumber}`, "questions");
                    const qSnap = await getDocs(qRef);
                    qCount = qSnap.size;
                } catch (e) {}
            }
            
            const hasQuestions = qCount > 0;
            
            // تحديث الحالة
            stageStatus[stageNumber] = {
                status: 'ready',
                unlockDate: unlockDate,
                questionsCount: qCount,
                hasQuestions: hasQuestions,
                completed: stageCompleted,
                error: null
            };
            
            // حفظ في الكاش
            localStorage.setItem(cacheKey, JSON.stringify({
                info: stageStatus[stageNumber],
                timestamp: Date.now()
            }));
            
            updateStageCard(stageNumber);
            
        } catch (error) {
            console.error(`Error loading stage ${stageNumber}:`, error);
            stageStatus[stageNumber] = {
                status: 'error',
                error: 'فشل التحميل',
                unlockDate: null,
                questionsCount: 0,
                hasQuestions: false,
                completed: false
            };
            updateStageCard(stageNumber);
        }
    }

    // ==================== تحديث بطاقة مرحلة واحدة ====================
    function updateStageCard(stageNumber) {
        const card = document.querySelector(`.stage-epic-card[data-stage="${stageNumber}"]`);
        if (!card) return;
        
        const data = stageStatus[stageNumber];
        if (!data || data.status === 'loading') return;
        
        const today = new Date().toISOString().split('T')[0];
        const icons = ['dragon', 'flask', 'rocket', 'tree', 'skull', 'robot', 'magic', 'crown', 'shield', 'bolt', 'book', 'star'];
        
        let statusClass = 'locked';
        let statusText = '🔒 مغلقة';
        let iconColor = 'rgba(255,255,255,0.3)';
        let questionsText = `${data.questionsCount || 0} سؤال`;
        
        if (data.completed) {
            statusClass = 'completed';
            statusText = '✅ مكتملة';
            iconColor = '#28a745';
            questionsText = `${data.questionsCount || 0} سؤال`;
        } else if (data.hasQuestions && data.unlockDate && today >= data.unlockDate) {
            statusClass = 'unlocked';
            statusText = '⚔️ متاحة';
            iconColor = '#D4AF37';
        } else if (data.status === 'error') {
            statusText = '❌ خطأ';
            iconColor = '#ff4444';
        } else if (!data.unlockDate) {
            statusText = '📝 قيد الإعداد';
        } else if (today < data.unlockDate) {
            statusText = `📅 ${new Date(data.unlockDate).toLocaleDateString('ar-EG')}`;
        } else if (!data.hasQuestions) {
            statusText = '📝 لا توجد أسئلة';
        }
        
        card.className = `stage-epic-card ${statusClass}`;
        card.innerHTML = `
            <div class="stage-icon-epic">
                <i class="fas fa-${icons[(stageNumber-1) % icons.length]}" style="color: ${iconColor};"></i>
            </div>
            <div class="stage-number-epic">الرحلة ${stageNumber}</div>
            <div class="stage-badge ${statusClass}">${statusText}</div>
            <div class="stage-questions-count" style="${data.completed ? 'color: #28a745;' : ''}">
                <i class="fas fa-question-circle"></i> ${questionsText}
            </div>
        `;
    }

    // ==================== التحقق والبدء عند النقر (المهم جداً) ====================
    async function checkAndStartStage(stageNumber) {
        const data = stageStatus[stageNumber];
        
        // إذا البيانات لسه ما تحملتش
        if (!data || data.status === 'loading') {
            // عرض مؤقت
            const card = document.querySelector(`.stage-epic-card[data-stage="${stageNumber}"]`);
            if (card) {
                card.innerHTML = `
                    <div class="stage-icon-epic">
                        <i class="fas fa-spinner fa-pulse" style="color: #D4AF37;"></i>
                    </div>
                    <div class="stage-number-epic">الرحلة ${stageNumber}</div>
                    <div class="stage-badge loading">⚡ جاري التحميل...</div>
                `;
            }
            
            // تحميل هذه المرحلة فوراً
            await loadSingleStageData(stageNumber);
            
            // بعد التحميل، تحقق مرة أخرى
            const newData = stageStatus[stageNumber];
            if (newData.hasQuestions && newData.unlockDate && 
                new Date().toISOString().split('T')[0] >= newData.unlockDate) {
                startStageEpic(stageNumber);
            } else {
                showLockMessage(stageNumber);
            }
            return;
        }
        
        // البيانات موجودة - تحقق من الصلاحية
        if (data.completed) {
            showCompletedMessage(stageNumber);
            return;
        }
        
        if (!data.hasQuestions) {
            Swal.fire({
                icon: 'info',
                title: '🚫 لا توجد أسئلة',
                text: 'هذه الرحلة قيد الإعداد حالياً',
                background: '#0B1E33',
                color: 'white',
                confirmButtonColor: '#D4AF37'
            });
            return;
        }
        
        const today = new Date().toISOString().split('T')[0];
        if (data.unlockDate && today >= data.unlockDate) {
            startStageEpic(stageNumber);
        } else if (data.unlockDate) {
            Swal.fire({
                icon: 'info',
                title: '📅 الرحلة مغلقة',
                text: `ستتاح في ${new Date(data.unlockDate).toLocaleDateString('ar-EG')}`,
                background: '#0B1E33',
                color: 'white',
                confirmButtonColor: '#D4AF37'
            });
        } else {
            Swal.fire({
                icon: 'info',
                title: '🚫 رحلة مغلقة',
                text: 'لم يتم تحديد تاريخ للفتح بعد',
                background: '#0B1E33',
                color: 'white',
                confirmButtonColor: '#D4AF37'
            });
        }
    }

    function showLockMessage(stageNumber) {
        const data = stageStatus[stageNumber];
        if (data.unlockDate) {
            Swal.fire({
                icon: 'info',
                title: '📅 الرحلة مغلقة',
                text: `ستتاح في ${new Date(data.unlockDate).toLocaleDateString('ar-EG')}`,
                background: '#0B1E33',
                color: 'white',
                confirmButtonColor: '#D4AF37'
            });
        } else {
            Swal.fire({
                icon: 'info',
                title: '🚫 رحلة مغلقة',
                text: 'لم يتم تحديد تاريخ للفتح بعد',
                background: '#0B1E33',
                color: 'white',
                confirmButtonColor: '#D4AF37'
            });
        }
    }

    // ==================== نظام منع إعادة اللعب ====================
    function showCompletedMessage(stage) {
        Swal.fire({
            title: '🏆 رحلة مكتملة!',
            html: `
                <div style="text-align: center;">
                    <i class="fas fa-trophy" style="font-size: 60px; color: #D4AF37; margin-bottom: 20px;"></i>
                    <p style="font-size: 18px;">لقد أكملت هذه الرحلة من قبل!</p>
                    <p style="color: #28a745;">إعادة اللعب لن تزيد نقاطك</p>
                </div>
            `,
            icon: 'success',
            background: '#0B1E33',
            color: 'white',
            confirmButtonColor: '#D4AF37',
            showCancelButton: true,
            cancelButtonColor: '#666',
            confirmButtonText: '⚔️ تدريب (بدون نقاط)',
            cancelButtonText: '🔙 العودة'
        }).then((result) => {
            if (result.isConfirmed) {
                startStageEpic(stage, true);
            }
        });
    }

    // ==================== بدء المرحلة ====================
    async function startStageEpic(stageNumber, trainingMode = false) {
        if (battleActive) return;
        
        const confirm = await Swal.fire({
            title: trainingMode ? '🏋️ وضع التدريب' : '⚔️ استعد للمعركة!',
            html: `
                <div style="text-align: center;">
                    <i class="fas ${trainingMode ? 'fa-dumbbell' : 'fa-dragon'}" style="font-size: 60px; color: #D4AF37; margin-bottom: 20px;"></i>
                    <p style="font-size: 20px;">${trainingMode ? 'تدريب الرحلة ' + stageNumber : 'مواجهة الرحلة ' + stageNumber}</p>
                    <p style="color: ${trainingMode ? '#28a745' : '#ff4444'};">
                        ${trainingMode ? '⚠️ لن تضاف النقاط' : '🔥 10 نقاط لكل إجابة صحيحة'}
                    </p>
                </div>
            `,
            showCancelButton: true,
            confirmButtonColor: '#D4AF37',
            cancelButtonColor: '#666',
            confirmButtonText: trainingMode ? 'ابدأ التدريب' : 'انطلق!',
            cancelButtonText: 'لاحقاً',
            background: '#0B1E33',
            color: 'white'
        });
        
        if (!confirm.isConfirmed) return;
        
        showLoadingEpic();
        currentStage = stageNumber;
        
        try {
            // تحميل الأسئلة مباشرة من Firebase (تجاهل الكاش)
            await loadQuestionsFromFirebase(stageNumber);
            
            if (currentQuestions.length === 0) {
                throw new Error("No questions");
            }
            
            // حفظ الأسئلة في الكاش للتشغيل السريع لاحقاً
            cacheQuestions(stageNumber, currentQuestions);
            
            hideLoadingEpic();
            startBattleEpic(trainingMode);
            
        } catch (error) {
            hideLoadingEpic();
            Swal.fire({ 
                icon: 'error', 
                title: 'عذراً', 
                text: 'لا توجد أسئلة', 
                background: '#0B1E33', 
                confirmButtonColor: '#D4AF37' 
            });
        }
    }

    // ==================== تحميل الأسئلة من Firebase مباشرة ====================
    async function loadQuestionsFromFirebase(stage) {
        const ref = collection(db, "adventures", grade, "stages", `stage${stage}`, "questions");
        const snap = await getDocs(ref);
        currentQuestions = [];
        snap.forEach(d => currentQuestions.push({ id: d.id, ...d.data() }));
        currentQuestions.sort((a, b) => (a.order || 0) - (b.order || 0));
    }

    function cacheQuestions(stage, questions) {
        const key = `stage_${grade}_${stage}_questions`;
        localStorage.setItem(key, JSON.stringify({ 
            questions, 
            timestamp: Date.now() 
        }));
    }

    // ==================== بدء المعركة (كما هي) ====================
    function startBattleEpic(trainingMode = false) {
        battleActive = true;
        currentIndex = 0;
        hearts = 3;
        correct = 0;
        
        window.trainingMode = trainingMode;
        
        document.getElementById('worldMap').style.display = 'none';
        document.getElementById('battleEpicArena').classList.add('active');
        
        updateHeartsEpic();
        renderQuestionEpic();
        setupExitProtectionEpic();
    }

    // ==================== عرض السؤال (كما هي) ====================
    function renderQuestionEpic() {
        if (currentIndex >= currentQuestions.length) {
            endStageEpic(true);
            return;
        }
        
        const q = currentQuestions[currentIndex];
        
        document.getElementById('questionCounterEpic').innerText = `${currentIndex + 1}/${currentQuestions.length}`;
        document.getElementById('currentStageEpic').innerText = `الرحلة ${currentStage} ${window.trainingMode ? '(تدريب)' : ''}`;
        document.getElementById('questionTextEpic').innerText = q.text;
        
        const scene = document.getElementById('battleSceneEpic');
        const avatar = document.getElementById('enemyEpic');
        
        scene.className = 'battle-scene-epic';
        switch(q.adventureType) {
            case 'lab': 
                scene.classList.add('lab'); 
                avatar.innerHTML = '<i class="fas fa-flask" style="color: #00d4ff;"></i>';
                break;
            case 'space': 
                scene.classList.add('space'); 
                avatar.innerHTML = '<i class="fas fa-rocket" style="color: #9d4edd;"></i>';
                break;
            case 'jungle': 
                scene.classList.add('jungle'); 
                avatar.innerHTML = '<i class="fas fa-tree" style="color: #28a745;"></i>';
                break;
            default: 
                scene.classList.add('monster'); 
                avatar.innerHTML = '<i class="fas fa-dragon" style="color: #D4AF37;"></i>';
        }
        
        const container = document.getElementById('optionsEpicContainer');
        container.innerHTML = '';
        
        const prefixes = ['A', 'B', 'C', 'D'];
        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-epic-btn';
            btn.innerHTML = `<span class="option-prefix-epic">${prefixes[idx]}</span><span>${opt}</span>`;
            btn.onclick = () => selectAnswerEpic(idx, q.correctAnswer);
            container.appendChild(btn);
        });
        
        gsap.from('.option-epic-btn', {
            duration: 0.6,
            opacity: 0,
            x: -50,
            stagger: 0.1,
            ease: "back.out(1.7)"
        });
        
        gsap.from('.enemy-epic', {
            duration: 0.8,
            scale: 0,
            rotation: 360,
            ease: "elastic.out(1, 0.5)"
        });
    }

    // ==================== اختيار الإجابة (كما هي) ====================
    function selectAnswerEpic(selected, correctIdx) {
        const btns = document.querySelectorAll('.option-epic-btn');
        btns.forEach(btn => btn.onclick = null);
        
        const isCorrect = selected === correctIdx;
        
        if (isCorrect) {
            btns[selected].classList.add('correct');
            
            gsap.timeline()
                .to('.battle-scene-epic', {
                    backgroundColor: 'rgba(40, 167, 69, 0.2)',
                    boxShadow: '0 0 100px #28a745',
                    duration: 0.3
                })
                .to('.enemy-epic i', {
                    scale: 0.8,
                    rotation: -15,
                    yoyo: true,
                    repeat: 1,
                    duration: 0.2,
                    ease: "power1.inOut"
                })
                .to('.enemy-epic i', {
                    color: '#28a745',
                    duration: 0.2,
                    yoyo: true,
                    repeat: 1
                });
            
            if (!window.trainingMode) {
                points += 10;
            }
            correct++;
            
            for (let i = 0; i < 8; i++) {
                createStarEffect();
            }
            
            if (points > 0 && points % 100 === 0) {
                showMilestoneEpic();
                checkAchievements();
            }
            
        } else {
            btns[selected].classList.add('wrong');
            btns[correctIdx].classList.add('correct');
            
            gsap.timeline()
                .to('.battle-scene-epic', {
                    x: -30,
                    y: 10,
                    rotation: -3,
                    duration: 0.1,
                    repeat: 4,
                    yoyo: true,
                    ease: "power1.inOut"
                })
                .to('.enemy-epic i', {
                    scale: 1.4,
                    color: '#ff4444',
                    duration: 0.2,
                    yoyo: true,
                    repeat: 2
                }, 0);
            
            hearts--;
            updateHeartsEpic();
            
            document.querySelector('.enemy-epic').classList.add('shake');
            setTimeout(() => {
                document.querySelector('.enemy-epic')?.classList.remove('shake');
            }, 500);
        }
        
        updatePointsEpic();
        
        if (hearts <= 0) {
            setTimeout(() => endStageEpic(false), 2000);
            return;
        }
        
        setTimeout(() => {
            currentIndex++;
            renderQuestionEpic();
        }, 2000);
    }

    // ==================== إنشاء تأثير نجوم ====================
    function createStarEffect() {
        const star = document.createElement('i');
        star.className = 'fas fa-star star-particle';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.setProperty('--x', (Math.random() - 0.5) * 200 + 'px');
        star.style.setProperty('--y', -100 - Math.random() * 100 + 'px');
        document.body.appendChild(star);
        
        setTimeout(() => star.remove(), 1500);
    }

    // ==================== عرض إنجاز 100 نقطة ====================
    function showMilestoneEpic() {
        const div = document.createElement('div');
        div.className = 'milestone-celebration';
        div.innerHTML = '<div class="celebration-text">🔥 100 نقطة 🔥</div>';
        document.body.appendChild(div);
        
        for (let i = 0; i < 20; i++) {
            setTimeout(() => createStarEffect(), i * 50);
        }
        
        showAchievement('💯 100 نقطة', 'أحسنت يا بطل!');
        
        setTimeout(() => div.remove(), 2000);
    }

    // ==================== نظام الإنجازات ====================
    function checkAchievements() {
        const newAchievements = [];
        
        if (points >= 100 && !achievements.includes('100_points')) {
            achievements.push('100_points');
            newAchievements.push('💯 100 نقطة');
        }
        if (points >= 500 && !achievements.includes('500_points')) {
            achievements.push('500_points');
            newAchievements.push('👑 500 نقطة - فارس العلم');
        }
        if (correct >= 10 && !achievements.includes('10_correct')) {
            achievements.push('10_correct');
            newAchievements.push('⚡ 10 إجابات صحيحة متتالية');
        }
        
        newAchievements.forEach(ach => showAchievement(ach, 'إنجاز جديد!'));
        
        if (newAchievements.length > 0) {
            studentData.achievements = achievements;
            localStorage.setItem('studentData', JSON.stringify(studentData));
        }
    }

    function showAchievement(title, desc) {
        const popup = document.createElement('div');
        popup.className = 'achievement-popup';
        popup.innerHTML = `
            <i class="fas fa-trophy"></i>
            <div>
                <div style="font-size: 18px; font-weight: 900; color: #D4AF37;">${title}</div>
                <div style="font-size: 14px;">${desc}</div>
            </div>
        `;
        document.body.appendChild(popup);
        
        setTimeout(() => {
            popup.classList.add('fade-out');
            setTimeout(() => popup.remove(), 500);
        }, 3000);
    }

    // ==================== إنهاء المرحلة ====================
    async function endStageEpic(completed) {
        battleActive = false;
        
        if (!window.trainingMode) {
            studentData.points = points;
            studentData.hearts = completed ? 3 : Math.max(1, hearts);
            studentData.lastStage = completed ? currentStage + 1 : currentStage;
            
            if (completed) {
                studentData.completedStages = studentData.completedStages || [];
                if (!studentData.completedStages.includes(currentStage)) {
                    studentData.completedStages.push(currentStage);
                }
                
                // تحديث حالة المرحلة في الذاكرة
                if (stageStatus[currentStage]) {
                    stageStatus[currentStage].completed = true;
                }
            }
            
            localStorage.setItem('studentData', JSON.stringify(studentData));
            
            if (db && studentData.firebaseId) {
                try {
                    await updateDoc(doc(db, "students", studentData.firebaseId), {
                        points: points,
                        hearts: studentData.hearts,
                        lastStage: studentData.lastStage,
                        lastActive: serverTimestamp()
                    });
                } catch (e) {}
            }
        }
        
        showResultEpic(completed);
    }

    // ==================== عرض النتيجة ====================
    function showResultEpic(completed) {
        const screen = document.getElementById('resultEpicScreen');
        
        if (window.trainingMode) {
            document.getElementById('resultEpicPoints').innerText = 'تدريب';
        } else {
            document.getElementById('resultEpicPoints').innerText = points;
        }
        
        document.getElementById('resultEpicCorrect').innerText = `${correct}/${currentQuestions.length}`;
        document.getElementById('resultEpicHearts').innerText = hearts;
        
        if (completed) {
            document.getElementById('resultEpicIcon').innerHTML = '<i class="fas fa-crown"></i>';
            document.getElementById('resultEpicTitle').innerText = '🏆 انتصار عظيم!';
            
            if (window.trainingMode) {
                document.getElementById('resultEpicMessage').innerText = 'تدريب ممتاز! مستعد للمعركة الحقيقية؟';
            } else {
                document.getElementById('resultEpicMessage').innerText = `مبروك يا بطل! مستر إسماعيل عماد فخور بك، جمعت ${points} نقطة!`;
            }
            
            for (let i = 0; i < 30; i++) {
                setTimeout(() => createStarEffect(), i * 50);
            }
            
        } else {
            document.getElementById('resultEpicIcon').innerHTML = '<i class="fas fa-skull"></i>';
            document.getElementById('resultEpicTitle').innerText = '💔 هزيمة مؤقتة';
            document.getElementById('resultEpicMessage').innerText = 'لا تستسلم! الأبطال يتعلمون من أخطائهم';
        }
        
        screen.style.display = 'flex';
        
        gsap.from('.result-epic-card', {
            duration: 1,
            scale: 0.5,
            rotation: -10,
            opacity: 0,
            ease: "back.out(1.7)"
        });
    }

    // ==================== العودة للخريطة ====================
    function backToMapEpic() {
        document.getElementById('resultEpicScreen').style.display = 'none';
        document.getElementById('battleEpicArena').classList.remove('active');
        document.getElementById('worldMap').style.display = 'block';
        window.trainingMode = false;
        
        // إعادة تحميل المرحلة المكتملة فقط
        if (stageStatus[currentStage]?.completed) {
            updateStageCard(currentStage);
        }
    }

    // ==================== إعادة المحاولة ====================
    function restartStageEpic() {
        document.getElementById('resultEpicScreen').style.display = 'none';
        startStageEpic(currentStage, window.trainingMode);
    }

    // ==================== تحديث القلوب ====================
    function updateHeartsEpic() {
        const container = document.getElementById('heartsEpicContainer');
        container.innerHTML = '';
        
        for (let i = 0; i < 3; i++) {
            const heart = document.createElement('i');
            heart.className = `fas fa-heart heart-epic ${i >= hearts ? 'lost' : ''}`;
            container.appendChild(heart);
        }
        
        if (hearts < 3) {
            gsap.to('.heart-epic', {
                scale: 1.2,
                duration: 0.2,
                yoyo: true,
                repeat: 1
            });
        }
    }

    function updatePointsEpic() {
        gsap.to('#pointsEpic', {
            scale: 1.3,
            duration: 0.2,
            yoyo: true,
            repeat: 1
        });
        document.getElementById('pointsEpic').innerText = points;
    }

    // ==================== حماية الخروج ====================
    function setupExitProtectionEpic() {
        history.pushState(null, null, location.href);
        window.onpopstate = () => {
            if (battleActive) {
                document.getElementById('exitWarningEpic').style.display = 'flex';
                history.pushState(null, null, location.href);
            }
        };
        
        window.onbeforeunload = (e) => {
            if (battleActive) {
                e.preventDefault();
                return '';
            }
        };
    }

    window.continueBattleEpic = function() {
        document.getElementById('exitWarningEpic').style.display = 'none';
    };

    // ==================== شاشة التحميل ====================
    function showLoadingEpic() {
        document.getElementById('loadingEpic').classList.remove('hidden');
        
        let idx = 0;
        const tip = document.getElementById('epicLoadingTip').querySelector('span');
        const interval = setInterval(() => {
            idx = (idx + 1) % epicTips.length;
            tip.innerText = epicTips[idx];
        }, 1500);
        
        window.loadingInterval = interval;
    }

    function hideLoadingEpic() {
        setTimeout(() => {
            document.getElementById('loadingEpic').classList.add('hidden');
            if (window.loadingInterval) clearInterval(window.loadingInterval);
        }, 500);
    }

    // ==================== دوال عامة ====================
    window.startStageEpic = startStageEpic;
    window.backToMapEpic = backToMapEpic;
    window.restartStageEpic = restartStageEpic;
    window.continueBattleEpic = continueBattleEpic;

    // ==================== وضع عدم الاتصال (معدل) ====================
    function useOfflineDataEpic() {
        studentData = JSON.parse(localStorage.getItem('studentData')) || {
            name: 'بطل',
            grade: grade,
            points: 0,
            hearts: 3,
            lastStage: 1,
            completedStages: []
        };
        
        document.getElementById('studentNameEpic').innerText = studentData.name;
        points = studentData.points;
        hearts = studentData.hearts;
        
        updateHeartsEpic();
        updatePointsEpic();
        
        // عرض بيانات وهمية سريعة
        for (let i = 1; i <= 12; i++) {
            const d = new Date();
            d.setDate(d.getDate() + (i - 1) * 7);
            
            stageStatus[i] = {
                status: 'ready',
                unlockDate: d.toISOString().split('T')[0],
                questionsCount: 15,
                hasQuestions: true,
                completed: studentData.completedStages?.includes(i) || false
            };
            updateStageCard(i);
        }
    }

    // ==================== التهيئة الجديدة ====================
    window.addEventListener('load', async () => {
        initEpicEffects();
        
        // عرض شاشة التحميل لجزء من الثانية فقط
        showLoadingEpic();
        
        try {
            // 1. تحميل بيانات الطالب (ضروري فوراً)
            await loadStudentDataEpic();
            
            // 2. عرض الخريطة فوراً (كلها حالة تحميل)
            renderStagesMapImmediately();
            
            // 3. إخفاء شاشة التحميل بسرعة
            setTimeout(() => hideLoadingEpic(), 800);
            
            // 4. بدأ تحميل بيانات المراحل في الخلفية (مرحلة بمرحلة مع تأخير)
            for (let i = 1; i <= 12; i++) {
                setTimeout(() => loadSingleStageData(i), i * 150);
            }
            
        } catch (error) {
            console.error("Init error:", error);
            hideLoadingEpic();
            useOfflineDataEpic();
        }
    });

    // ==================== مراقبة الاتصال ====================
    window.addEventListener('online', () => {
        Swal.fire({ 
            icon: 'success', 
            title: 'تم الاتصال', 
            text: 'جاري تحديث البيانات...', 
            timer: 2000, 
            background: '#0B1E33', 
            confirmButtonColor: '#D4AF37',
            showConfirmButton: false
        });
        
        // إعادة تحميل البيانات عند العودة للاتصال
        for (let i = 1; i <= 12; i++) {
            loadSingleStageData(i);
        }
    });

</script>

</body>
</html>
