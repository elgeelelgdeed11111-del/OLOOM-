<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>أكاديمية إسماعيل عماد | بوابة المغامرة الكبرى</title>
    
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- GSAP مع Fallback -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* ===== المتغيرات الموحدة ===== */
        :root {
            --primary-gold: #D4AF37;
            --primary-gold-light: #f5d97b;
            --primary-gold-dark: #b88c1f;
            --primary-dark: #0B1E33;
            --primary-darker: #030812;
            --error-red: #ff4444;
            --success-green: #28a745;
            --energy-blue: #00d4ff;
            --magic-purple: #9d4edd;
            --fire-orange: #ff6b35;
            --ice-cyan: #4ecdc4;
            --transition-smooth: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at center, #1a2f44, var(--primary-darker));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== خلفية كونية متحركة ===== */
        .cosmic-portal-bg {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(2px 2px at 10% 20%, #fff, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 20% 40%, var(--primary-gold), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 30% 60%, var(--energy-blue), rgba(0,0,0,0)),
                radial-gradient(4px 4px at 40% 80%, var(--magic-purple), rgba(0,0,0,0)),
                radial-gradient(3px 3px at 50% 10%, var(--fire-orange), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 60% 30%, var(--ice-cyan), rgba(0,0,0,0)),
                radial-gradient(3px 3px at 70% 50%, #fff, rgba(0,0,0,0)),
                radial-gradient(4px 4px at 80% 70%, var(--primary-gold), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90% 90%, var(--magic-purple), rgba(0,0,0,0));
            background-size: 600px 600px;
            opacity: 0.5;
            animation: portalCosmicSpin 300s linear infinite;
            z-index: -2;
        }

        @keyframes portalCosmicSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .portal-nebula {
            position: fixed;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(212, 175, 55, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 212, 255, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 40% 50%, rgba(157, 78, 221, 0.2) 0%, transparent 50%);
            filter: blur(70px);
            animation: portalNebulaFloat 30s ease-in-out infinite alternate;
            z-index: -1;
        }

        @keyframes portalNebulaFloat {
            0% { transform: scale(1) rotate(0deg); opacity: 0.3; }
            100% { transform: scale(1.4) rotate(10deg); opacity: 0.7; }
        }

        /* ===== الحاوية الرئيسية ===== */
        .portal-container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            position: relative;
            z-index: 100; /* زيادة z-index */
        }

        /* ===== البطاقة الرئيسية ===== */
        .portal-card {
            background: rgba(11, 30, 51, 0.95); /* زيادة الشفافية */
            backdrop-filter: blur(25px) saturate(200%);
            -webkit-backdrop-filter: blur(25px) saturate(200%);
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 70px;
            padding: clamp(30px, 8vw, 50px) clamp(25px, 6vw, 40px);
            box-shadow: 
                0 40px 80px -20px rgba(0, 0, 0, 0.8),
                0 0 0 2px rgba(212, 175, 55, 0.2) inset,
                0 0 50px rgba(212, 175, 55, 0.3);
            position: relative;
            overflow: visible; /* تغيير من hidden إلى visible */
            opacity: 1;
            visibility: visible;
        }

        /* خطوط طاقة متحركة */
        .portal-energy-lines {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, 
                transparent, 
                var(--primary-gold), 
                var(--energy-blue), 
                var(--magic-purple), 
                var(--fire-orange), 
                transparent
            );
            animation: energyScan 4s linear infinite;
            opacity: 0.6;
            z-index: 101;
        }

        .portal-energy-lines:nth-child(2) {
            top: auto;
            bottom: 0;
            animation-direction: reverse;
            animation-duration: 3s;
        }

        @keyframes energyScan {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* ===== أيقونة البوابة ===== */
        .portal-icon {
            text-align: center;
            margin-bottom: clamp(25px, 6vw, 35px);
            position: relative;
            z-index: 102;
            opacity: 1;
            visibility: visible;
        }

        .portal-icon i {
            font-size: clamp(80px, 20vw, 110px);
            background: linear-gradient(135deg, var(--primary-gold), var(--magic-purple), var(--energy-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 40px rgba(212, 175, 55, 0.6));
            animation: portalIconFloat 4s infinite ease-in-out;
        }

        @keyframes portalIconFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.1); }
        }

        /* ===== النصوص الترحيبية ===== */
        .portal-welcome {
            text-align: center;
            margin-bottom: clamp(30px, 7vw, 45px);
            z-index: 102;
            opacity: 1;
            visibility: visible;
        }

        .portal-welcome h1 {
            font-size: clamp(30px, 8vw, 42px);
            font-weight: 900;
            background: linear-gradient(135deg, 
                var(--primary-gold), 
                var(--energy-blue), 
                var(--magic-purple), 
                var(--fire-orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            animation: welcomeGlow 3s infinite;
        }

        @keyframes welcomeGlow {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(212,175,55,0.5)); }
            50% { filter: drop-shadow(0 0 40px rgba(157,78,221,0.7)); }
        }

        .portal-welcome p {
            color: rgba(255,255,255,0.9);
            font-size: clamp(16px, 4.5vw, 20px);
            line-height: 1.7;
        }

        .highlight-gold {
            color: var(--primary-gold);
            font-weight: 700;
            display: inline-block;
            margin: 0 5px;
            text-shadow: 0 0 15px rgba(212,175,55,0.5);
        }

        /* ===== حقول الإدخال ===== */
        .portal-input-group {
            margin-bottom: clamp(25px, 6vw, 35px);
            z-index: 102;
            opacity: 1;
            visibility: visible;
        }

        .portal-label {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255,255,255,0.9);
            font-weight: 700;
            margin-bottom: 12px;
            padding-right: 8px;
            font-size: clamp(14px, 4vw, 17px);
        }

        .portal-label i {
            color: var(--primary-gold);
            font-size: clamp(16px, 4.5vw, 20px);
            filter: drop-shadow(0 0 10px currentColor);
        }

        .portal-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(212, 175, 55, 0.25);
            border-radius: 40px;
            padding: clamp(16px, 5vw, 22px) clamp(20px, 5vw, 28px);
            color: white;
            font-size: clamp(16px, 4.5vw, 19px);
            transition: var(--transition-smooth);
            -webkit-appearance: none;
            appearance: none;
            backdrop-filter: blur(5px);
        }

        .portal-input:focus {
            outline: none;
            border-color: var(--primary-gold);
            box-shadow: 0 0 0 5px rgba(212, 175, 55, 0.2), 0 0 30px rgba(212,175,55,0.3);
            background: rgba(0, 0, 0, 0.7);
            transform: scale(1.02);
        }

        .portal-input::placeholder {
            color: rgba(255,255,255,0.3);
            font-size: clamp(14px, 4vw, 17px);
        }

        /* ===== القائمة المنسدلة ===== */
        .portal-select-wrapper {
            position: relative;
            width: 100%;
        }

        .portal-select {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(212, 175, 55, 0.25);
            border-radius: 40px;
            padding: clamp(16px, 5vw, 22px) clamp(20px, 5vw, 28px);
            color: white;
            font-size: clamp(16px, 4.5vw, 19px);
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
            transition: var(--transition-smooth);
            backdrop-filter: blur(5px);
        }

        .portal-select option {
            background: var(--primary-dark);
            color: white;
            padding: 15px;
        }

        .portal-select:focus {
            outline: none;
            border-color: var(--primary-gold);
            box-shadow: 0 0 0 5px rgba(212, 175, 55, 0.2);
        }

        .portal-select-wrapper::after {
            content: '\f078';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            left: 25px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-gold);
            pointer-events: none;
            font-size: clamp(14px, 4vw, 18px);
            transition: var(--transition-smooth);
            z-index: 103;
        }

        .portal-select-wrapper:hover::after {
            transform: translateY(-50%) scale(1.2);
        }

        /* ===== زر البداية المحسن ===== */
        .portal-start-btn {
            width: 100%;
            background: linear-gradient(135deg, 
                var(--primary-gold), 
                var(--magic-purple), 
                var(--energy-blue));
            border: none;
            border-radius: 60px;
            padding: clamp(20px, 6vw, 28px) 25px;
            color: var(--primary-dark);
            font-size: clamp(20px, 6vw, 28px);
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            cursor: pointer;
            transition: var(--transition-smooth);
            margin: clamp(30px, 8vw, 45px) 0 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px -10px rgba(212, 175, 55, 0.6);
            border: 2px solid rgba(255,255,255,0.2);
            -webkit-tap-highlight-color: transparent;
            min-height: 80px;
            opacity: 1;
            visibility: visible;
            z-index: 200; /* زيادة z-index */
            pointer-events: auto; /* تأكيد التفاعل */
        }

        .portal-start-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.8s ease;
            z-index: -1;
        }

        .portal-start-btn:hover::before {
            left: 100%;
        }

        .portal-start-btn i {
            font-size: clamp(22px, 6vw, 32px);
            transition: transform 0.4s ease;
        }

        .portal-start-btn:active {
            transform: scale(0.95);
            box-shadow: 0 10px 30px -5px rgba(212,175,55,0.8);
        }

        .portal-start-btn:active i {
            transform: translateX(-12px) rotate(-10deg);
        }

        /* حالة التحميل */
        .portal-start-btn.loading {
            background: linear-gradient(135deg, #8b6f2b, #5e3b8a, #007b9e);
            pointer-events: none;
            opacity: 0.9;
        }

        .portal-start-btn.loading i {
            animation: btnSpin 1.2s linear infinite;
        }

        @keyframes btnSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ===== رسالة الخطأ ===== */
        .portal-error {
            background: rgba(255, 68, 68, 0.15);
            border: 2px solid rgba(255, 68, 68, 0.3);
            border-radius: 40px;
            padding: 18px 25px;
            color: #ff8a8a;
            font-size: clamp(14px, 4vw, 17px);
            display: flex;
            align-items: center;
            gap: 18px;
            margin: 20px 0 15px;
            animation: errorShake 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
            display: none;
            backdrop-filter: blur(10px);
            z-index: 150;
        }

        .portal-error.success {
            background: rgba(212, 175, 55, 0.15);
            border-color: var(--primary-gold);
            color: var(--primary-gold);
        }

        .portal-error i {
            font-size: 24px;
            flex-shrink: 0;
        }

        @keyframes errorShake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        /* ===== الملاحظات ===== */
        .portal-note {
            text-align: center;
            color: rgba(255,255,255,0.4);
            font-size: clamp(13px, 3.8vw, 15px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 25px;
            z-index: 102;
        }

        .portal-note i {
            color: var(--primary-gold);
            font-size: 14px;
        }

        /* ===== شريط التقدم ===== */
        .portal-progress {
            margin-top: 30px;
            height: 6px;
            background: rgba(212, 175, 55, 0.1);
            border-radius: 6px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: 102;
        }

        .portal-progress.visible {
            opacity: 1;
        }

        .portal-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, 
                var(--primary-gold), 
                var(--energy-blue), 
                var(--magic-purple), 
                var(--fire-orange), 
                var(--primary-gold));
            border-radius: 6px;
            transition: width 0.3s ease;
            animation: progressGlow 2s infinite;
        }

        @keyframes progressGlow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }

        /* ===== مؤشر عدم الاتصال ===== */
        .portal-offline {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 68, 68, 0.95);
            backdrop-filter: blur(15px);
            color: white;
            padding: 12px 30px;
            border-radius: 60px;
            font-size: 16px;
            display: none;
            align-items: center;
            gap: 12px;
            z-index: 1000;
            border: 2px solid rgba(255, 68, 68, 0.5);
            box-shadow: 0 10px 30px rgba(255,68,68,0.3);
        }

        /* ===== تحسينات الهاتف ===== */
        @media (max-width: 380px) {
            .portal-card {
                padding: 25px 20px;
                border-radius: 50px;
            }

            .portal-icon i {
                font-size: 70px;
            }

            .portal-welcome h1 {
                font-size: 26px;
            }

            .portal-start-btn {
                padding: 18px;
                font-size: 20px;
                min-height: 70px;
            }
        }

        /* ===== دعم Safe Area ===== */
        @supports (padding: max(0px)) {
            body {
                padding-left: max(12px, env(safe-area-inset-left));
                padding-right: max(12px, env(safe-area-inset-right));
                padding-top: max(12px, env(safe-area-inset-top));
                padding-bottom: max(12px, env(safe-area-inset-bottom));
            }
        }

        /* ===== تحسينات اللمس ===== */
        .portal-input,
        .portal-select,
        .portal-start-btn {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        select, input {
            font-size: 16px; /* منع التكبير في iOS */
        }
    </style>
</head>
<body>

<!-- خلفية كونية -->
<div class="cosmic-portal-bg"></div>
<div class="portal-nebula"></div>

<!-- مؤشر عدم الاتصال -->
<div id="portalOffline" class="portal-offline">
    <i class="fas fa-wifi-slash"></i>
    <span>وضع عدم الاتصال - بعض الميزات قد لا تعمل</span>
</div>

<!-- حاوية البوابة الرئيسية -->
<div class="portal-container">
    <div class="portal-card">
        <div class="portal-energy-lines"></div>
        <div class="portal-energy-lines"></div>
        
        <!-- الأيقونة -->
        <div class="portal-icon">
            <i class="fas fa-dragon"></i>
        </div>
        
        <!-- النصوص الترحيبية -->
        <div class="portal-welcome">
            <h1>بوابة المغامرة الكبرى</h1>
            <p>
                <i class="fas fa-shield-alt" style="color: #D4AF37;"></i>
                أهلاً بك يا
                <span class="highlight-gold">بطل العلوم</span>
                <i class="fas fa-shield-alt" style="color: #D4AF37;"></i>
            </p>
            <p style="margin-top: 12px; font-size: 0.9em; color: rgba(255,255,255,0.7);">
                الوحوش تنتظرك، والمذاكرة هي سلاحك السري!
            </p>
        </div>
        
        <!-- حقول الإدخال -->
        <div class="portal-input-group">
            <div class="portal-label">
                <i class="fas fa-user-astronaut"></i>
                <span>الاسم الرباعي للبطل</span>
            </div>
            <input 
                type="text" 
                id="studentName" 
                class="portal-input" 
                placeholder="مثال: أحمد محمد علي حسن" 
                autocomplete="off" 
                inputmode="text"
                maxlength="100"
            >
        </div>
        
        <div class="portal-input-group">
            <div class="portal-label">
                <i class="fas fa-graduation-cap"></i>
                <span>الرتبة الدراسية</span>
            </div>
            <div class="portal-select-wrapper">
                <select id="gradeSelect" class="portal-select">
                    <option value="" disabled selected>-- اختر صفك الدراسي --</option>
                    <option value="grade4">الصف الرابع الابتدائي</option>
                    <option value="grade5">الصف الخامس الابتدائي</option>
                    <option value="grade6">الصف السادس الابتدائي</option>
                    <option value="grade7">الصف الأول الإعدادي</option>
                    <option value="grade8">الصف الثاني الإعدادي</option>
                    <option value="grade9">الصف الثالث الإعدادي</option>
                </select>
            </div>
        </div>
        
        <!-- رسالة الخطأ -->
        <div id="portalErrorMessage" class="portal-error">
            <i class="fas fa-exclamation-triangle"></i>
            <span id="portalErrorText"></span>
        </div>
        
        <!-- زر بدء المغامرة -->
        <button class="portal-start-btn" id="portalStartBtn">
            <span>افتح البوابة</span>
            <i class="fas fa-arrow-left"></i>
        </button>
        
        <!-- الملاحظات -->
        <div class="portal-note">
            <i class="fas fa-lock"></i>
            <span>المغامرات متاحة للرابع الابتدائي والأول الإعدادي حالياً</span>
            <i class="fas fa-lock"></i>
        </div>
        
        <!-- شريط التقدم -->
        <div id="portalProgressContainer" class="portal-progress">
            <div id="portalProgressFill" class="portal-progress-fill"></div>
        </div>
    </div>
</div>

<!-- Firebase SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
    import { 
        getFirestore, 
        doc, 
        setDoc,

    } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    // ==================== تكوين Firebase ====================

        authDomain: "manassa-oloom.firebaseapp.com",
        databaseURL: "https://manassa-oloom-default-rtdb.firebaseio.com",
        projectId: "manassa-oloom",
        storageBucket: "manassa-oloom.firebasestorage.app",
        messagingSenderId: "475047988456",
        appId: "1:475047988456:web:ab25a9b01b5c77483b0d5d",
        measurementId: "G-F0N011WQB9"
    };

    // ==================== تهيئة Firebase مع Fallback ====================
    let app, db;
    let firebaseAvailable = false;
    
    try {
        app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        
        enableIndexedDbPersistence(db).catch((err) => {
            console.log("⚠️ Persistence disabled:", err.code);
        });
        
        firebaseAvailable = true;
        console.log("✅ Firebase initialized");
    } catch (error) {
        console.error("❌ Firebase error, continuing offline:", error);
    }

    // ==================== النطاق العام (Window) ====================
    // تصدير الدوال المهمة إلى window لتكون متاحة
    window.fb = { db, firebaseAvailable };
    window.showPortalError = showPortalError;
    window.setPortalLoading = setPortalLoading;

    // ==================== دوال مساعدة ====================
    function generateEpicStudentId(name, grade) {
        const cleanName = name.trim().replace(/\s+/g, '_').substring(0, 30);
        const timestamp = Date.now();
        const random = Math.floor(Math.random() * 10000);
        const epicSuffix = ['dragon', 'phoenix', 'warrior', 'knight', 'wizard'][Math.floor(Math.random() * 5)];
        return `${cleanName}_${grade}_${timestamp}_${random}_${epicSuffix}`;
    }

    function showPortalError(message, isSuccess = false) {
        const errorDiv = document.getElementById('portalErrorMessage');
        const errorText = document.getElementById('portalErrorText');
        const card = document.querySelector('.portal-card');
        
        errorDiv.style.display = 'flex';
        errorText.innerText = message;
        
        if (isSuccess) {
            errorDiv.classList.add('success');
        } else {
            errorDiv.classList.remove('success');
            if (card) {
                card.style.animation = 'errorShake 0.6s ease';
                setTimeout(() => {
                    card.style.animation = '';
                }, 600);
            }
        }
    }

    function setPortalLoading(isLoading) {
        const btn = document.getElementById('portalStartBtn');
        const progress = document.getElementById('portalProgressContainer');
        
        if (!btn || !progress) return;
        
        if (isLoading) {
            btn.classList.add('loading');
            btn.innerHTML = '<span>جاري فتح البوابة...</span> <i class="fas fa-spinner"></i>';
            btn.disabled = true;
            progress.classList.add('visible');
            
            let width = 0;
            const interval = setInterval(() => {
                width += 2;
                document.getElementById('portalProgressFill').style.width = width + '%';
                if (width >= 100) clearInterval(interval);
            }, 30);
            
            window.loadingInterval = interval;
        } else {
            btn.classList.remove('loading');
            btn.innerHTML = '<span>افتح البوابة</span> <i class="fas fa-arrow-left"></i>';
            btn.disabled = false;
            setTimeout(() => {
                progress.classList.remove('visible');
                document.getElementById('portalProgressFill').style.width = '0%';
                if (window.loadingInterval) clearInterval(window.loadingInterval);
            }, 500);
        }
    }

    // ==================== التحقق من صحة البيانات ====================
    function validatePortalInputs(name, grade) {
        if (!name || name.length < 10) {
            showPortalError('يا بطل، اكتب اسمك الرباعي كاملاً (4 أسماء على الأقل)');
            return false;
        }
        
        const nameParts = name.split(' ').filter(w => w.length > 0);
        if (nameParts.length < 3) {
            showPortalError('الاسم يجب أن يتكون من 3 أسماء على الأقل');
            return false;
        }
        
        if (!grade) {
            showPortalError('اختر رتبتك الدراسية يا بطل');
            return false;
        }
        
        return true;
    }

    // ==================== حفظ الطالب (مع Timeout) ====================
    async function saveStudentToFirebase(studentData) {
        if (!db || !firebaseAvailable) {
            console.log("ℹ️ Firebase unavailable, using localStorage only");
            return null;
        }
        
        // Promise with timeout (5 ثواني كحد أقصى)
        const timeoutPromise = new Promise((_, reject) => {
            setTimeout(() => reject(new Error("Firebase timeout")), 5000);
        });
        
        try {
            const studentId = generateEpicStudentId(studentData.name, studentData.grade);
            const studentRef = doc(db, "students", studentId);
            
            const fullStudentData = {
                ...studentData,
                id: studentId,
                name: studentData.name.trim(),
                grade: studentData.grade,
                points: 0,
                hearts: 3,
                lastStage: 1,
                joinedAt: Timestamp.now(),
                lastActive: Timestamp.now(),
                totalSubmissions: 0,
                completedStages: [],
                achievements: [],
                deviceInfo: /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ? 'mobile' : 'desktop',
                lastLogin: new Date().toISOString()
            };
            
            // سباق بين الحفظ والتايم آوت
            await Promise.race([
                setDoc(studentRef, fullStudentData),
                timeoutPromise
            ]);
            
            console.log("✅ Student saved to Firebase:", studentId);
            return studentId;
            
        } catch (error) {
            console.warn("⚠️ Firebase save failed (continuing offline):", error.message);
            return null;
        }
    }

    // ==================== الدالة الرئيسية ====================
    async function startEpicAdventure() {
        const nameInput = document.getElementById('studentName');
        const gradeSelect = document.getElementById('gradeSelect');
        
        if (!nameInput || !gradeSelect) {
            console.error("❌ Elements not found");
            return;
        }
        
        document.getElementById('portalErrorMessage').style.display = 'none';
        
        const name = nameInput.value.trim();
        const grade = gradeSelect.value;
        
        if (!validatePortalInputs(name, grade)) return;
        
        if (grade !== 'grade4' && grade !== 'grade7') {
            showPortalError('يا بطل، هذه الرحلة قيد التحضير، انتظرنا قريباً!');
            return;
        }
        
        setPortalLoading(true);
        
        try {
            // تأثير GSAP (مع Fallback)
            if (window.gsap) {
                gsap.to('.portal-card', {
                    scale: 0.95,
                    duration: 0.3,
                    yoyo: true,
                    repeat: 1,
                    ease: "power1.inOut"
                });
            }
            
            const studentData = {
                name: name,
                grade: grade,
                joinedAt: new Date().toISOString(),
                points: 0,
                hearts: 3,
                lastStage: 1,
                completedStages: [],
                achievements: []
            };
            
            localStorage.setItem('studentData', JSON.stringify(studentData));
            
            // محاولة حفظ في Firebase (لا تمنع الانتقال)
            saveStudentToFirebase(studentData).then(studentId => {
                if (studentId) {
                    const localData = JSON.parse(localStorage.getItem('studentData'));
                    localData.firebaseId = studentId;
                    localStorage.setItem('studentData', JSON.stringify(localData));
                }
            }).catch(err => console.log("Background save failed:", err));
            
            showPortalError('✅ تم فتح البوابة! جاري النقل...', true);
            
            // تأثيرات نهائية
            if (window.gsap) {
                gsap.to('.portal-card', {
                    scale: 1.05,
                    rotation: 2,
                    duration: 0.4,
                    yoyo: true,
                    repeat: 1
                });
            }
            
            // نجوم احتفالية
            for (let i = 0; i < 10; i++) {
                setTimeout(() => createPortalStar(), i * 50);
            }
            
            // الانتقال للصفحة التالية (حتى لو فشل Firebase)
            setTimeout(() => {
                const targetPage = grade === 'grade4' ? 'challenge40.html' : 'challenge10.html';
                window.location.href = targetPage;
            }, 1000);
            
        } catch (error) {
            console.error("❌ Error in adventure:", error);
            showPortalError('حدث خطأ، جاري المتابعة محلياً...');
            
            // حفظ محلي احتياطي
            const studentData = {
                name: name,
                grade: grade,
                joinedAt: new Date().toISOString()
            };
            localStorage.setItem('studentData', JSON.stringify(studentData));
            
            setTimeout(() => {
                const targetPage = grade === 'grade4' ? 'challenge40.html' : 'challenge10.html';
                window.location.href = targetPage;
            }, 1500);
        } finally {
            setPortalLoading(false);
        }
    }

    // ==================== تأثير نجوم البوابة ====================
    function createPortalStar() {
        try {
            const star = document.createElement('i');
            star.className = 'fas fa-star';
            star.style.position = 'fixed';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.color = '#D4AF37';
            star.style.fontSize = (15 + Math.random() * 25) + 'px';
            star.style.zIndex = '9999';
            star.style.pointerEvents = 'none';
            star.style.opacity = '0.8';
            star.style.transform = 'scale(0)';
            document.body.appendChild(star);
            
            if (window.gsap) {
                gsap.to(star, {
                    scale: 1,
                    duration: 0.3,
                    ease: "back.out(2)",
                    onComplete: () => {
                        gsap.to(star, {
                            y: -100,
                            opacity: 0,
                            rotation: 360,
                            duration: 0.8,
                            ease: "power2.out",
                            onComplete: () => star.remove()
                        });
                    }
                });
            } else {
                // Fallback بدون GSAP
                star.style.transform = 'scale(1)';
                setTimeout(() => star.remove(), 1000);
            }
        } catch (e) {
            console.log("Star effect failed");
        }
    }

    // ==================== التحقق من حالة الاتصال ====================
    function updatePortalOnlineStatus() {
        const indicator = document.getElementById('portalOffline');
        if (!indicator) return;
        
        if (!navigator.onLine) {
            indicator.style.display = 'flex';
            if (window.gsap) {
                gsap.fromTo(indicator, 
                    { y: -100, opacity: 0 },
                    { y: 0, opacity: 1, duration: 0.5, ease: "back.out(1.7)" }
                );
            }
        } else {
            if (window.gsap) {
                gsap.to(indicator, {
                    y: -100,
                    opacity: 0,
                    duration: 0.5,
                    ease: "power2.in",
                    onComplete: () => indicator.style.display = 'none'
                });
            } else {
                indicator.style.display = 'none';
            }
        }
    }

    window.addEventListener('online', updatePortalOnlineStatus);
    window.addEventListener('offline', updatePortalOnlineStatus);
    updatePortalOnlineStatus();

    // ==================== تحميل البيانات المحفوظة ====================
    function loadSavedPortalData() {
        try {
            const saved = localStorage.getItem('studentData');
            if (saved) {
                const data = JSON.parse(saved);
                document.getElementById('studentName').value = data.name || '';
            }
        } catch (e) {
            console.log("No saved data");
        }
    }

    // ==================== ربط الزر بالدالة (مع التأكد من وجود الزر) ====================
    function initEventListeners() {
        const startBtn = document.getElementById('portalStartBtn');
        const nameInput = document.getElementById('studentName');
        
        if (startBtn) {
            // إزالة أي مستمع قديم
            startBtn.replaceWith(startBtn.cloneNode(true));
            const newBtn = document.getElementById('portalStartBtn');
            newBtn.addEventListener('click', startEpicAdventure);
            console.log("✅ Button event listener attached");
        } else {
            console.error("❌ Button not found!");
        }
        
        if (nameInput) {
            nameInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') startEpicAdventure();
            });
        }
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.target.tagName !== 'BUTTON') {
                e.preventDefault();
            }
        });
    }

    // ==================== أنيميشن GSAP المتسلسل (Timeline) مع Fallback ====================
    function runEntranceAnimation() {
        const elements = {
            icon: document.querySelector('.portal-icon'),
            welcome: document.querySelector('.portal-welcome'),
            inputs: document.querySelectorAll('.portal-input-group'),
            button: document.querySelector('.portal-start-btn')
        };
        
        // تأكد من ظهور العناصر حتى بدون GSAP
        if (!window.gsap) {
            console.log("GSAP not available, showing elements directly");
            if (elements.icon) elements.icon.style.opacity = '1';
            if (elements.welcome) elements.welcome.style.opacity = '1';
            elements.inputs.forEach(el => el.style.opacity = '1');
            if (elements.button) elements.button.style.opacity = '1';
            return;
        }
        
        // إخفاء العناصر مؤقتاً
        gsap.set([elements.icon, elements.welcome, ...elements.inputs, elements.button], {
            opacity: 0,
            y: 30
        });
        
        // إنشاء Timeline
        const tl = gsap.timeline({
            defaults: { ease: "back.out(1.7)", duration: 0.8 }
        });
        
        tl.to(elements.icon, { opacity: 1, y: 0 })
          .to(elements.welcome, { opacity: 1, y: 0 }, "-=0.4")
          .to(elements.inputs, { 
              opacity: 1, 
              y: 0, 
              stagger: 0.2 
          }, "-=0.3")
          .to(elements.button, { 
              opacity: 1, 
              y: 0, 
              scale: 1,
              onStart: () => {
                  // تأكيد ظهور الزر
                  elements.button.style.visibility = 'visible';
                  elements.button.style.pointerEvents = 'auto';
              }
          }, "-=0.2");
    }

    // ==================== التهيئة عند تحميل الصفحة ====================
    window.addEventListener('load', () => {
        loadSavedPortalData();
        initEventListeners();
        runEntranceAnimation();
        
        console.log("🚀 Epic Portal Ready!");
        console.log("✅ Button should be visible and clickable");
    });

    // ==================== تصدير الدوال إلى window (للأمان) ====================
    window.startEpicAdventure = startEpicAdventure;
    window.startAdventureFallback = function() {
        const name = document.getElementById('studentName')?.value.trim();
        const grade = document.getElementById('gradeSelect')?.value;
        
        if (!name || !grade) {
            alert('يا بطل، اكتب اسمك واختر صفك أولاً!');
            return;
        }
        
        localStorage.setItem('studentData', JSON.stringify({ name, grade }));
        
        if (grade === 'grade4') window.location.href = 'challenge40.html';
        else if (grade === 'grade7') window.location.href = 'challenge10.html';
        else alert('هذه المرحلة غير متاحة حالياً');
    };

</script>
